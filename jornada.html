<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyberappfin: a jornada do pacote</title>
<meta name="description" content="Apresentação interativa do ambiente de segurança da Cyberappfin (Defesa Cibernética, Impacta).">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B1520'/%3E%3Crect x='12' y='40' width='40' height='6' rx='3' fill='%2314B8A6'/%3E%3Crect x='12' y='29' width='40' height='6' rx='3' fill='%238B5CF6'/%3E%3Crect x='12' y='18' width='40' height='6' rx='3' fill='%23F59E0B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1520; --bg-2:#101E2C; --panel:#13212F; --line:#26384A; --line-2:#344B61;
    --text:#F4F7FA; --muted:#B7C6D5; --soft:#DCE5EE;
    --net:#14B8A6; --iam:#8B5CF6; --soc:#F59E0B; --end:#22C55E; --grc:#EAB308;
    --brand:#4C8DF6; --danger:#F87171;
    --panel-w:560px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; background:var(--bg); color:var(--text); font-family:'DM Sans', system-ui, sans-serif; overflow:hidden; }
  body{ -webkit-user-select:none; user-select:none; }
  /* cursor some depois de 2,5 s parado; volta ao mexer o mouse */
  body.sem-cursor, body.sem-cursor *{ cursor:none !important; }
  /* tela preta (tecla B ou ponto, como nos passadores de slide) */
  #preto{ position:fixed; inset:0; background:#000; z-index:50; opacity:0; pointer-events:none; transition:opacity .3s ease; }
  body.tela-preta #preto{ opacity:1; pointer-events:auto; }
  .mono{ font-family:'JetBrains Mono', ui-monospace, monospace; }

  /* ---------- palco ---------- */
  #stage{ position:fixed; inset:0 var(--panel-w) 64px 0; }
  #mapa{ width:100%; height:100%; display:block; }
  #mapa text{ font-family:'DM Sans', system-ui, sans-serif; fill:var(--text); }
  #mapa .t-title{ font-family:'Sora', system-ui, sans-serif; font-weight:700; }
  #mapa .t-mono{ font-family:'JetBrains Mono', ui-monospace, monospace; fill:var(--muted); }
  #mapa .t-muted{ fill:var(--muted); }
  .no{ transition:opacity .45s ease; }
  body.focando .no{ opacity:.18; }
  body.focando .no.foco{ opacity:1; }
  .lig{ fill:none; stroke:var(--line-2); stroke-width:2.5; }
  .lig.trac{ stroke-dasharray:7 7; }
  .barramento{ fill:none; stroke:#3E5A75; stroke-width:7; stroke-linecap:round; }
  .host rect{ transition:stroke .3s, fill .3s; }
  .host.alerta rect{ stroke:var(--danger) !important; fill:#3A1C21 !important; }
  .host.ok rect{ stroke:#4ADE80 !important; fill:#13301F !important; }
  .pulso{ animation:pulso 1.4s ease-in-out infinite; }
  @keyframes pulso{ 0%,100%{ opacity:1 } 50%{ opacity:.35 } }

  /* ---------- marca d'água da faculdade (canto superior direito) ---------- */
  #marca{ position:fixed; top:16px; right:22px; height:34px; width:auto; z-index:30; pointer-events:none;
          filter:brightness(0) invert(1); opacity:.42; }
  body.modo-sala #marca{ height:40px; top:22px; right:30px; }

  /* ---------- painel lateral ---------- */
  #painel{
    position:fixed; top:0; right:0; bottom:64px; width:var(--panel-w);
    background:var(--panel); border-left:1px solid var(--line);
    display:flex; flex-direction:column; overflow:hidden;
  }
  #painel .topo{ padding:28px 36px 0; display:flex; flex-direction:column; gap:10px; }
  #quem{ align-self:flex-start; font-size:13px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
         padding:6px 12px; border-radius:999px; background:#1C2F42; color:var(--soft); }
  #painel h1{ font-family:'Sora', system-ui, sans-serif; font-size:32px; line-height:1.15; font-weight:700; }
  #painel .sub{ color:var(--muted); font-size:16px; }
  #conteudo{ padding:20px 36px 32px; overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:16px; }
  #conteudo p{ font-size:17px; line-height:1.55; color:var(--soft); }
  #conteudo b{ color:var(--text); }
  #conteudo h3{ font-family:'Sora', system-ui, sans-serif; font-size:15px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-top:6px; }
  #conteudo ul{ list-style:none; display:flex; flex-direction:column; gap:8px; }
  #conteudo li{ font-size:16.5px; line-height:1.45; color:var(--soft); padding-left:18px; position:relative; }
  #conteudo li::before{ content:""; position:absolute; left:0; top:.6em; width:7px; height:7px; border-radius:50%; background:var(--cor, var(--brand)); }
  #conteudo table{ width:100%; border-collapse:collapse; font-size:15px; }
  #conteudo th{ text-align:left; color:var(--muted); font-weight:700; padding:7px 8px; border-bottom:1px solid var(--line-2); }
  #conteudo td{ padding:7px 8px; border-bottom:1px solid var(--line); color:var(--soft); vertical-align:top; }
  #conteudo tr.dest td{ color:var(--text); background:#2A2112; }
  #conteudo tr.perigo td{ color:var(--text); background:#2C1A1E; }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{ font-size:14px; padding:5px 11px; border-radius:999px; background:#1C2F42; color:var(--soft); }
  .cards{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .card{ background:var(--bg-2); border:1px solid var(--line); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:4px; }
  .card .n{ font-family:'Sora', system-ui, sans-serif; font-size:28px; font-weight:800; color:var(--cor, var(--brand)); line-height:1.1; }
  .card .l{ font-size:14px; color:var(--muted); }
  .barras{ display:flex; flex-direction:column; gap:7px; }
  .barra{ display:grid; grid-template-columns:100px 1fr 44px; align-items:center; gap:10px; font-size:15px; color:var(--soft); }
  .barra i{ display:block; height:14px; border-radius:4px; }
  .aviso{ font-size:14px; color:#F5B95A; border-left:3px solid #F5B95A; padding:6px 10px; background:#241C10; border-radius:0 8px 8px 0; }
  .passos{ display:flex; flex-direction:column; gap:8px; counter-reset:p; }
  .passo{ display:flex; gap:12px; align-items:flex-start; font-size:16px; color:var(--muted); transition:color .3s; }
  .passo::before{ counter-increment:p; content:counter(p); flex-shrink:0; width:26px; height:26px; border-radius:50%;
                  display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; background:#1C2F42; color:var(--muted); }
  .passo.ativo{ color:var(--text); }
  .passo.ativo::before{ background:var(--cp, var(--danger)); color:#1A0E10; }
  .passo.feito{ color:var(--soft); }
  .passo.feito::before{ content:"✓"; background:#1F3A2C; color:#4ADE80; }
  /* link para documento (painel e telas cheias) */
  .doc-link{ align-self:flex-start; display:inline-flex; gap:10px; align-items:center; text-decoration:none; font-weight:700;
             font-size:16px; color:#0B1520; background:#EAB308; padding:10px 18px; border-radius:10px; box-shadow:0 6px 18px rgba(0,0,0,.3); }
  .doc-link:hover{ background:#FACC15; }
  .doc-link small{ font-weight:500; font-size:.8em; opacity:.8; }
  /* notas de fala: flutuam acima do rodapé, nos dois modos */
  #notas{ display:none; position:fixed; left:24px; bottom:80px; width:min(760px, 60vw); z-index:20; padding:16px 18px;
          background:rgba(9,18,27,.96); border:1px dashed #4B6580; border-radius:12px;
          font-size:16px; line-height:1.5; color:var(--soft); max-height:32vh; overflow-y:auto; box-shadow:0 12px 30px rgba(0,0,0,.4); }
  body.com-notas #notas{ display:block; }

  /* ---------- foto (ou vídeo) do prédio na abertura ---------- */
  #capa-midia{ position:fixed; left:0; top:0; width:100%; height:calc(100% - 64px); overflow:hidden; background:#0B1A2E; opacity:0; pointer-events:none; transition:opacity .8s ease; }
  #capa-midia img, #capa-midia video{ width:100%; height:100%; object-fit:cover; object-position:70% 50%; transform-origin:72% 55%; }
  #capa-midia img{ animation:aproxima 24s ease-in-out infinite alternate; }
  #capa-midia::after{ content:""; position:absolute; inset:0;
    background:linear-gradient(90deg, rgba(11,21,32,.96) 0%, rgba(11,21,32,.82) 34%, rgba(11,21,32,.25) 60%, rgba(11,21,32,0) 78%),
               linear-gradient(0deg, rgba(11,21,32,.7) 0%, rgba(11,21,32,0) 30%); }
  @keyframes aproxima{ from{ transform:translateX(7%) scale(1) } to{ transform:translateX(7%) scale(1.09) } }
  body.com-foto #capa-midia{ opacity:1; }
  body.com-foto #stage{ opacity:0 !important; }
  body.com-foto #sala{ background:transparent; }
  body.com-foto .s-corpo{ max-width:47vw; }
  /* foto ao fundo de outras telas de sala (mais escura, sem estreitar o texto) */
  body.foto-fundo #capa-midia{ opacity:1; }
  body.foto-fundo #capa-midia::after{ background:rgba(11,21,32,.86); }
  body.foto-fundo #stage{ opacity:0 !important; }
  body.foto-fundo #sala{ background:transparent; }
  /* "entrar no prédio": zoom contínuo até a porta de entrada e dissolve no mapa */
  body.entrando #capa-midia{ opacity:1; }
  body.entrando #capa-midia::after{ background:rgba(11,21,32,.1); transition:background .5s ease; }
  body.entrando #capa-midia img{ transform-origin:57% 77%; animation:entrar 1.7s cubic-bezier(.55,0,.35,1) forwards; }
  body.entrando #sala, body.entrando #painel, body.entrando #stage{ opacity:0 !important; }
  /* fora das telas com foto, ela some na hora (sem reaparecer depois do zoom) */
  body:not(.com-foto):not(.foto-fundo):not(.entrando) #capa-midia{ transition:none; }
  @keyframes entrar{
    0%  { transform:translateX(7%) scale(1.02); filter:blur(0) brightness(1); opacity:1; }
    70% { filter:blur(2px) brightness(1.25); opacity:1; }
    100%{ transform:translateX(7%) scale(7); filter:blur(8px) brightness(1.6); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){ #capa-midia img{ animation:none !important; } }

  /* ---------- modo "sala de reunião": telas cheias de processo e gestão ---------- */
  #stage, #painel{ transition:opacity .5s ease, transform .6s cubic-bezier(.22,.61,.36,1), filter .5s ease; }
  body.modo-sala #stage{ opacity:.12; transform:scale(.94); filter:blur(3px); }
  body.modo-sala #painel{ opacity:0; transform:translateX(40px); pointer-events:none; }
  #sala{
    position:fixed; inset:0 0 64px 0; display:flex; flex-direction:column; gap:3.2vh;
    padding:6vh 6vw 5vh; overflow-y:auto;
    background:radial-gradient(ellipse at 20% 15%, rgba(26,48,74,.92) 0%, rgba(11,21,32,.97) 60%);
    opacity:0; pointer-events:none; transform:translateY(16px);
    transition:opacity .5s ease .1s, transform .6s cubic-bezier(.22,.61,.36,1) .1s;
  }
  body.modo-sala #sala{ opacity:1; pointer-events:auto; transform:none; }
  .s-head{ display:flex; flex-direction:column; gap:1.2vh; }
  .s-quem{ align-self:flex-start; font-size:clamp(12px, .9vw, 15px); font-weight:700; letter-spacing:.12em; text-transform:uppercase;
           padding:6px 14px; border-radius:999px; background:#1C2F42; }
  .s-titulo{ font-family:'Sora', system-ui, sans-serif; font-size:clamp(34px, 3.6vw, 64px); font-weight:800; line-height:1.05; letter-spacing:-.01em; }
  .s-sub{ font-size:clamp(16px, 1.2vw, 22px); color:var(--muted); }
  .s-corpo{ flex:1; display:flex; flex-direction:column; gap:2.6vh; min-height:0; }
  .s-txt{ font-size:clamp(16px, 1.15vw, 21px); line-height:1.5; color:var(--soft); }
  .s-txt b{ color:var(--text); }
  .s-rot{ font-family:'Sora', system-ui, sans-serif; font-size:clamp(12px, .85vw, 15px); font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
  .linha{ display:grid; gap:1.4vw; }
  .bloco{ background:#132233; border:1px solid var(--line); border-radius:16px; padding:clamp(16px, 1.6vw, 28px);
          display:flex; flex-direction:column; gap:10px; position:relative; overflow:hidden; }
  .bloco::before{ content:""; position:absolute; left:0; top:0; right:0; height:5px; background:var(--cor, var(--brand)); }
  .bloco h4{ font-family:'Sora', system-ui, sans-serif; font-size:clamp(18px, 1.45vw, 26px); font-weight:700; line-height:1.2; }
  .bloco p{ font-size:clamp(14px, 1vw, 18px); line-height:1.45; color:var(--soft); }
  .bloco .grande{ font-family:'Sora', system-ui, sans-serif; font-size:clamp(34px, 3.4vw, 60px); font-weight:800; line-height:1; color:var(--cor, var(--brand)); }
  .bloco .rot{ font-size:clamp(12px, .85vw, 15px); font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  .bloco .rodape{ margin-top:auto; padding-top:10px; border-top:1px solid var(--line); font-size:clamp(14px, 1vw, 18px); color:var(--text); }
  .chips2{ display:flex; flex-wrap:wrap; gap:10px; }
  .chips2 span{ font-size:clamp(14px, 1vw, 18px); padding:7px 14px; border-radius:999px; background:#1C2F42; color:var(--soft); }
  /* linha do tempo */
  .tempo{ display:grid; grid-template-columns:repeat(var(--n), 1fr); gap:0; position:relative; }
  .tempo::before{ content:""; position:absolute; left:4%; right:4%; top:22px; height:3px; background:linear-gradient(90deg, var(--brand), var(--soc)); opacity:.6; }
  .etapa{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px; padding:0 8px; position:relative; }
  .etapa .bola{ width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center;
                font-family:'Sora', system-ui, sans-serif; font-weight:800; font-size:18px; background:#0B1520; border:3px solid var(--cor, var(--brand)); color:var(--text); }
  .etapa h4{ font-family:'Sora', system-ui, sans-serif; font-size:clamp(15px, 1.15vw, 21px); font-weight:700; line-height:1.2; }
  .etapa p{ font-size:clamp(13px, .95vw, 17px); line-height:1.4; color:var(--muted); }
  /* organograma do CSIRT */
  .org{ display:flex; flex-direction:column; align-items:center; gap:0; }
  .org .chefe{ background:#2A2112; border:2px solid var(--soc); border-radius:14px; padding:14px 26px; text-align:center; }
  .org .chefe h4{ font-family:'Sora', system-ui, sans-serif; font-size:clamp(17px, 1.3vw, 23px); }
  .org .chefe p{ font-size:clamp(13px, .95vw, 16px); color:var(--soft); }
  .org .tronco{ width:3px; height:22px; background:var(--line-2); }
  .org .ramos{ display:grid; grid-template-columns:repeat(6, 1fr); gap:12px; width:100%; position:relative; padding-top:22px; }
  .org .ramos::before{ content:""; position:absolute; top:0; left:8.3%; right:8.3%; height:3px; background:var(--line-2); }
  .org .membro{ background:#132233; border:1px solid var(--line); border-top:4px solid var(--cor); border-radius:12px; padding:14px; position:relative; }
  .org .membro::before{ content:""; position:absolute; top:-26px; left:50%; width:3px; height:22px; background:var(--line-2); }
  .org .membro h4{ font-family:'Sora', system-ui, sans-serif; font-size:clamp(14px, 1.05vw, 19px); margin-bottom:6px; }
  .org .membro p{ font-size:clamp(12px, .9vw, 16px); line-height:1.4; color:var(--soft); }
  /* barras de tempo (RTO) */
  .rto{ display:flex; flex-direction:column; gap:14px; }
  .rto .item{ display:grid; grid-template-columns:minmax(160px, 22%) 1fr; gap:16px; align-items:center; }
  .rto .nome{ font-size:clamp(15px, 1.1vw, 20px); font-weight:700; }
  .rto .trilho{ position:relative; height:38px; background:#132233; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .rto .trilho i{ position:absolute; left:0; top:0; bottom:0; border-radius:10px 0 0 10px; }
  .rto .trilho span{ position:absolute; top:50%; transform:translateY(-50%); font-size:clamp(13px, .95vw, 17px); white-space:nowrap; color:var(--text); }
  /* documentos */
  .doc{ background:#F3F1EA; color:#1D2733; border-radius:6px 26px 6px 6px; padding:clamp(18px, 1.6vw, 28px); display:flex; flex-direction:column; gap:10px;
        box-shadow:0 18px 40px rgba(0,0,0,.35); position:relative; }
  .doc::after{ content:""; position:absolute; top:0; right:0; width:26px; height:26px; background:linear-gradient(225deg, #0B1520 50%, #CFCAB9 50%); border-radius:0 0 0 6px; }
  .doc .cod{ font-family:'JetBrains Mono', monospace; font-size:clamp(12px, .85vw, 15px); color:#5B6573; }
  .doc h4{ font-family:'Sora', system-ui, sans-serif; font-size:clamp(17px, 1.3vw, 23px); line-height:1.2; }
  .doc p{ font-size:clamp(13px, .95vw, 17px); line-height:1.45; color:#3B4654; }
  .doc .selo2{ align-self:flex-start; margin-top:auto; font-size:clamp(12px, .85vw, 15px); font-weight:700; padding:5px 12px; border-radius:999px; }
  /* camadas da aplicação */
  .pilha{ display:grid; grid-template-columns:1fr auto 1fr auto 1fr; gap:14px; align-items:stretch; }
  .seta{ align-self:center; font-size:34px; color:var(--line-2); }
  .s-aviso{ font-size:clamp(13px, .95vw, 17px); color:#F5B95A; border-left:3px solid #F5B95A; padding:8px 12px; background:#241C10; border-radius:0 8px 8px 0; align-self:flex-start; }
  .lema2{ display:flex; gap:20px; flex-wrap:wrap; font-family:'Sora', system-ui, sans-serif; font-size:clamp(20px, 2vw, 34px); font-weight:700; color:var(--soft); }
  .lema2 span:nth-child(even){ color:#4B6580; }
  .faixa{ height:6px; width:min(520px, 60%); border-radius:3px; background:linear-gradient(90deg, var(--brand), var(--iam), var(--net), var(--soc), var(--end)); }
  /* BIA: relógios por serviço */
  .relogio{ display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; padding:6px 0; }
  .relogio div{ display:flex; flex-direction:column; gap:2px; }
  .relogio b{ white-space:nowrap; font-family:'Sora', system-ui, sans-serif; font-size:clamp(17px, 1.6vw, 30px); font-weight:800; line-height:1.05; color:var(--cor); }
  .relogio span{ font-size:clamp(11px, .8vw, 14px); font-weight:700; letter-spacing:.1em; color:var(--muted); }
  /* BIA: mapa de calor no tempo */
  .calor{ display:grid; grid-template-columns:minmax(150px, 15%) repeat(5, 1fr); gap:6px; }
  .calor .cab{ font-family:'Sora', system-ui, sans-serif; font-size:clamp(13px, 1vw, 18px); font-weight:700; color:var(--muted); text-align:center; padding:6px 0; }
  .calor .srv{ font-size:clamp(14px, 1.05vw, 19px); font-weight:700; display:flex; align-items:center; }
  .calor .cel{ border-radius:8px; padding:clamp(8px, .8vw, 14px) 6px; text-align:center; font-size:clamp(13px, .95vw, 17px); font-weight:700; color:#160C0E; }
  .calor .n2{ background:#FACC15; } .calor .n3{ background:#FB923C; } .calor .n4{ background:#F87171; }
  .marcos{ display:grid; grid-template-columns:minmax(150px, 15%) repeat(5, 1fr); gap:6px; margin-top:4px; }
  .marcos p{ font-size:clamp(12px, .88vw, 16px); line-height:1.4; color:var(--soft); border-top:2px solid var(--line-2); padding-top:8px; }
  /* BIA: ordem de recuperação */
  .ordem .bloco{ flex-direction:row; align-items:flex-start; gap:14px; }
  .ordem .num{ font-family:'Sora', system-ui, sans-serif; font-size:clamp(26px, 2.4vw, 44px); font-weight:800; line-height:1; color:var(--cor); min-width:1.2em; }
  /* escalonamento em escada */
  .escada{ display:grid; grid-template-columns:repeat(5, 1fr); gap:1vw; align-items:end; }
  .escada .bloco{ gap:8px; }
  .escada .bloco:nth-child(2){ margin-bottom:2.2vh; } .escada .bloco:nth-child(3){ margin-bottom:4.4vh; }
  .escada .bloco:nth-child(4){ margin-bottom:6.6vh; } .escada .bloco:nth-child(5){ margin-bottom:8.8vh; }
  .escada .rodape{ font-size:clamp(13px, .92vw, 16px); color:var(--soft); }
  .escada .rodape b{ color:var(--cor); }
  /* DRP: fluxo da restauração e checklist */
  .fluxo{ display:flex; align-items:stretch; gap:8px; }
  .fluxo .passo2{ flex:1; background:#132233; border:1px solid var(--line); border-top:4px solid var(--cor, #EAB308); border-radius:12px;
                  padding:clamp(10px, .9vw, 16px); display:flex; flex-direction:column; gap:4px; }
  .fluxo .passo2 b{ font-family:'Sora', system-ui, sans-serif; font-size:clamp(14px, 1.05vw, 19px); line-height:1.2; }
  .fluxo .passo2 span{ font-size:clamp(12px, .85vw, 15px); color:var(--muted); line-height:1.35; }

  .mitiga .acoes{ display:flex; flex-wrap:wrap; gap:6px; align-content:center; background:#132233; border-radius:8px; padding:8px 10px; }

  .legenda{ display:flex; gap:18px; font-size:clamp(14px, 1vw, 18px); color:var(--muted); }

  /* links para o ambiente real */

<body>

  <svg id="mapa" viewBox="0 0 1600 920" preserveAspectRatio="xMidYMid meet" aria-label="Topologia da Cyberappfin"></svg>
</div>

  <span id="contador"></span>
  <button id="prox" aria-label="Próxima parada">Próxima →</button>
  <span id="dica">← → navega · N notas · F tela cheia · B tela preta</span>

<script>
/* =====================================================================
   Cyberappfin: a jornada do pacote
   Fonte dos dados: inventário do grupo, plano V2 de provisionamento,
   relatório OpenVAS de 11/09/2026 e as políticas POL-GI-001 / POL-CN-001.
   ===================================================================== */

const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('mapa');
const MUNDO = [0, 0, 1600, 920];

const COR = { net:'#14B8A6', iam:'#8B5CF6', soc:'#F59E0B', end:'#22C55E', grc:'#EAB308', brand:'#4C8DF6', danger:'#F87171', cinza:'#64809B' };

/* ---------- VLANs e hosts (revisão do grupo, 14/10/2026) ---------- */
const VLANS = [
  { n:10, uso:'Gerência',   rede:'10.10.10.0/24', cor:COR.brand, hosts:[['Workstation 01','gerência · 10.10.10.x'],['Workstation 02','gerência · 10.10.10.x'],['Workstation 03','gerência · 10.10.10.x']] },
  { n:20, uso:'Servidores', rede:'10.10.20.0/24', cor:COR.iam,   hosts:[['NT-001 · AD-01','10.10.20.10'],['NT-002 · AD-02','10.10.20.11']] },
  { n:30, uso:'DMZ',        rede:'10.10.30.0/27', cor:COR.danger, hosts:[['Firefly · firesrv','10.10.30.3']] },
  { n:40, uso:'Usuários',   rede:'10.10.40.0/24', cor:COR.end,   hosts:[['Workstation','10.10.40.x'],['Workstation','10.10.40.x'],['Workstation','10.10.40.x']] },
  { n:50, uso:'Segurança / SOC', rede:'10.10.50.0/27', cor:COR.soc, hosts:[['Wazuh Manager','10.10.50.21'],['Zabbix + Grafana','10.10.50.15'],['OpenVAS','10.10.50.7'],['CyberFin IA','10.10.50.19'],['ITSM · Zammad','10.10.50.17']] },
  { n:60, uso:'Backup',     rede:'10.10.60.0/24', cor:COR.grc,   hosts:[['NT-003 · Backup','10.10.60.143']] }
];
/* ---------- links para o ambiente real ----------
   Clicar no servidor do mapa (ou no botão do painel) abre a ferramenta numa aba nova.
   Só funciona no computador conectado à rede do laboratório. Endereço vazio = sem link. */
const AMBIENTE = {
  'Wazuh Manager':    [['Wazuh', 'https://10.10.50.21']],
  'Zabbix + Grafana': [['Zabbix', 'http://10.10.50.15/zabbix'], ['Grafana', 'http://10.10.50.15:3000']],
  'OpenVAS':          [['OpenVAS', 'https://10.10.50.7:9392']],
  'CyberFin IA':      [['CyberFin IA', '']],
  'ITSM · Zammad':    [['Zammad', 'http://10.10.50.17']],
  'Firefly · firesrv': [['Firefly', 'http://10.0.50.2:8080']]
};
const linksDe = nome => (AMBIENTE[nome] || []).filter(([, url]) => url);
function botoesAmbiente(...nomes){
  const l = nomes.flatMap(linksDe);
  return l.length ? `<div class="amb">${l.map(([rot, url]) =>
    `<a class="amb-link" href="${url}" target="_blank" rel="noopener">Abrir ${rot} ↗ <small>${url.replace(/^https?:\/\//, '')}</small></a>`).join('')}</div>` : '';
}
const COL_W = 236;
const COL_X = i => 30 + i * 258;            // canto esquerdo da coluna
const COL_CX = i => COL_X(i) + COL_W / 2;   // centro da coluna
const HOST_Y = j => 500 + j * 70;           // topo do host
const ULT = VLANS.length - 1;
const LANE = i => COL_X(i) + COL_W - 5;     // corredor à direita da coluna (por onde o pacote sobe)
const colDe = x => Math.max(0, Math.min(ULT, Math.floor((x - 30) / 258)));
const hostCentro = (i, j) => ({ x: COL_CX(i), y: HOST_Y(j) + 29 });
const BUS_Y = 360;

/* ---------- desenho ---------- */
function el(tag, attrs = {}, pai = svg){
  const e = document.createElementNS(NS, tag);
  for(const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  pai.appendChild(e);
  return e;
}
function texto(pai, x, y, str, attrs = {}){
  const t = el('text', { x, y, ...attrs }, pai);
  t.textContent = str;
  return t;
}
function grupo(id, extra = ''){
  return el('g', { 'data-id': id, class: 'no ' + extra });
}

// fundo com grade suave
const defs = el('defs');
defs.innerHTML = `
  <pattern id="grade" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#132332" stroke-width="1"/>
  </pattern>
  <filter id="brilho" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>`;

// camada de animações (pacotes) por cima de tudo
const camada = el('g', { id:'camada' });

/* ---------- pacotes animados ---------- */
let geracao = 0;          // muda a cada parada: cancela animações antigas
const loops = [];
function limparAnimacoes(){
  geracao++;
  loops.length = 0;
  camada.innerHTML = '';
}
// caminho em "L" passando pelo barramento: host -> trunk -> host
// sai do host pelo corredor lateral da coluna, passa pelo trunk e desce pelo corredor da coluna de destino
function viaBus(a, b){
  const la = LANE(colDe(a.x)), lb = LANE(colDe(b.x));
  if(la === lb) return [a, { x:la, y:a.y }, { x:la, y:b.y }, b];
  return [a, { x:la, y:a.y }, { x:la, y:BUS_Y }, { x:lb, y:BUS_Y }, { x:lb, y:b.y }, b];
}
function pacote(pontos, cor, dur = 1600, raio = 7){
  const minha = geracao;
  return new Promise(resolve => {
    const d = 'M' + pontos.map(p => `${p.x} ${p.y}`).join(' L');
    const trilha = el('path', { d, fill:'none', stroke:cor, 'stroke-width':2, 'stroke-opacity':.35, 'stroke-dasharray':'4 6' }, camada);
    const c = el('circle', { r:raio, fill:cor, filter:'url(#brilho)' }, camada);
    const total = trilha.getTotalLength();
    const reduzir = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const t0 = performance.now();
    function quadro(t){
      if(minha !== geracao){ resolve(false); return; }
      const k = reduzir ? 1 : Math.min(1, (t - t0) / dur);
      const p = trilha.getPointAtLength(total * k);
      c.setAttribute('cx', p.x); c.setAttribute('cy', p.y);
      if(k < 1) requestAnimationFrame(quadro);
      else { setTimeout(() => { trilha.remove(); c.remove(); resolve(true); }, 250); }
    }
    requestAnimationFrame(quadro);
  });
}
// repete um conjunto de pacotes enquanto a parada estiver ativa
function emLoop(fn, intervalo){
  const minha = geracao;
  (async function volta(){
    while(minha === geracao){
      fn();
      await new Promise(r => setTimeout(r, intervalo));
    }
  })();
}

/* ---------- câmera (viewBox animado) ---------- */
let vbAtual = [...MUNDO];
let animCam = null;
function camera(alvo, dur = 900){
  const ini = [...vbAtual];
  const t0 = performance.now();
  cancelAnimationFrame(animCam);
  const ease = k => k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
  const reduzir = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function quadro(t){
    const k = reduzir ? 1 : Math.min(1, (t - t0) / dur);
    vbAtual = ini.map((v, i) => v + (alvo[i] - v) * ease(k));
    svg.setAttribute('viewBox', vbAtual.join(' '));
    if(k < 1) animCam = requestAnimationFrame(quadro);
  }
  animCam = requestAnimationFrame(quadro);
}

  document.body.classList.add('focando');
  ids.forEach(id => svg.querySelector(`[data-id="${id}"]`)?.classList.add('foco'));
}

// pacote barrado pelo firewall: para no topo da coluna de destino e mostra um ✗
async function barrado(pontos){
  const fim = pontos[pontos.length - 1];
  if(!await pacote(pontos, COR.danger, 1500, 7)) return;
  const t = el('text', { x:fim.x - 10, y:fim.y - 8, 'text-anchor':'end', 'font-size':15, 'font-weight':800, 'letter-spacing':1, fill:COR.danger }, camada);
  t.textContent = '✗ BLOQUEADO';
  setTimeout(() => t.remove(), 1300);
}

/* ---------- DR: restauração do ambiente a partir do NT-003 ---------- */
const DR = { ad:['1-0', '1-1'], soc:['4-0', '4-1', '4-2', '4-3', '4-4'], dmz:['2-0'], bk:'5-0' };
const SERVIDORES = [...DR.ad, ...DR.soc, ...DR.dmz];
const centroDe = k => { const [i, j] = k.split('-').map(Number); return hostCentro(i, j); };
function perdida(k){ const h = hostEls[k]; h.classList.remove('ok'); h.classList.add('alerta'); selo(h, 'PERDIDA', COR.danger, 2); }
// etiqueta no TrueNAS (ambiente externo), onde fica o repositório de backup
const TRUENAS = { x:1427, y:244 };
function seloTrueNAS(txt, cor){
  svg.querySelector('.selo-ext')?.remove();
  const t = el('text', { x:1536, y:266, 'text-anchor':'end', class:'selo-ext', 'font-size':12, 'font-weight':700, 'letter-spacing':1.5, fill:cor }, svg.querySelector('[data-id="externo"]'));
  t.textContent = txt;
}
// caminho do TrueNAS até o NT-003: sai do ambiente externo, passa pelo Cisco e desce pelo corredor da VLAN 60
const rotaTrueNAS = () => { const nt = hostCentro(5, 0); return [{x:1427,y:274},{x:1427,y:290},{x:1040,y:290},{x:1040,y:170},{x:820,y:170},{x:820,y:BUS_Y},{x:LANE(5),y:BUS_Y},{x:LANE(5),y:nt.y},nt]; };
function restaurado(k){ const h = hostEls[k]; h.classList.remove('alerta'); h.classList.add('ok'); selo(h, '✓ OK', '#4ADE80', 2); h.querySelector('.selo').classList.remove('pulso'); }
const TODAS = [DR.bk, ...SERVIDORES];
async function rodarDR(passo){
  const minha = geracao;
  const vivo = () => minha === geracao;
  const bk = centroDe(DR.bk);
  const espera = ms => new Promise(r => setTimeout(r, ms));
  // estado de partida: o que já voltou nas fases anteriores (o NT-003 volta na fase 1)
  const fases = [[], [DR.bk], DR.ad, DR.soc, DR.dmz];
  const prontos = passo >= 5 ? TODAS : fases.slice(0, passo).flat();
  TODAS.forEach(k => prontos.includes(k) ? restaurado(k) : perdida(k));
  seloTrueNAS('ÍNTEGRO', '#4ADE80');
  if(passo === 0){
    // as VMs caem uma a uma; a rede e o TrueNAS continuam de pé
    TODAS.forEach(k => { hostEls[k].classList.remove('alerta'); hostEls[k].querySelector('.selo')?.remove(); });
    for(const k of TODAS){
      if(!vivo()) return;
      perdida(k);
      await espera(240);
    }
    return;
  }
  if(passo === 1){
    // rede conferida VLAN por VLAN; depois o NT-003 volta, ligado ao repositório no TrueNAS
    VLANS.forEach((v, i) => setTimeout(() => pacote([{x:820,y:225},{x:820,y:BUS_Y},{x:LANE(i),y:BUS_Y},{x:LANE(i),y:400}], COR.net, 1500, 6), i * 140));
    await espera(2400);
    if(vivo() && await pacote(rotaTrueNAS(), COR.grc, 2200, 8) && vivo()) restaurado(DR.bk);
    return;
  }
  // fases 2 a 4: cada servidor sai do NT-003, um depois do outro
  const restaurar = async (k, de = bk, cor = COR.grc) => { if(await pacote(viaBus(de, centroDe(k)), cor, 1300, 7) && vivo()) restaurado(k); };
  if(passo === 2){ await restaurar('1-0'); if(vivo()) await restaurar('1-1', centroDe('1-0'), '#C4B5FD'); return; }
  if(passo === 3){ for(const k of DR.soc){ if(!vivo()) return; await restaurar(k); } return; }
  if(passo === 4){ await restaurar('2-0'); return; }
  // fase 5: agentes voltam a falar com o Wazuh e o backup novo vai para o NT-003
  const wz = centroDe('4-0');
  emLoop(() => {
    SERVIDORES.filter(k => k !== '4-0').forEach((k, n) => setTimeout(() => pacote(viaBus(centroDe(k), wz), COR.soc, 1500, 5), n * 120));
    setTimeout(() => SERVIDORES.forEach((k, n) => setTimeout(() => pacote(viaBus(centroDe(k), bk), COR.grc, 1500, 5), n * 120)), 1700);
  }, 4200);
}

  /* =================== SALA: processo de resposta a incidentes =================== */
  {
    quem:P3, cor:COR.soc, titulo:'Matriz de severidade', sub:'POL-GI-001 · cada incidente confirmado recebe um nível',
    sala:`<div class="s-corpo">
        <div class="linha" style="grid-template-columns:repeat(4, 1fr)">
          <div class="bloco" style="--cor:#4ADE80"><span class="rot">Nível 1</span><h4>Baixa</h4><p>Evento isolado, sem impacto.</p><p><b>Ex.:</b> malware bloqueado pelo antivírus.</p><div class="rodape">Resposta em até <b>2 h</b></div></div>
          <div class="bloco" style="--cor:#FACC15"><span class="rot">Nível 2</span><h4>Média</h4><p>Área pontual, sem parar serviço crítico.</p><p><b>Ex.:</b> credencial comum comprometida.</p><div class="rodape">Resposta em até <b>1 h</b></div></div>
          <div class="bloco" style="--cor:#FB923C; box-shadow:0 0 0 2px #FB923C"><span class="rot">Nível 3 · nosso cenário</span><h4>Alta</h4><p>Parada parcial de BPO/Folha ou suspeita de vazamento.</p><p><b>Ex.:</b> phishing bem-sucedido em Contas a Pagar.</p><div class="rodape">Resposta em até <b>30 min</b></div></div>
          <div class="bloco" style="--cor:#F87171"><span class="rot">Nível 4</span><h4>Crítica</h4><p>Parada total, vazamento massivo ou ransomware.</p><p><b>Ex.:</b> criptografia de servidores.</p><div class="rodape">Resposta em até <b>15 min</b></div></div>
        </div>
        <p class="s-txt">Níveis <b>3 e 4</b> acionam o CSIRT e exigem Relatório de Causa do Incidente (RCI) em até <b>5 dias úteis</b>.</p>
      </div>`,
    notas:'O phishing que acabamos de ver é nível 3: phishing bem-sucedido em Contas a Pagar pode desviar pagamentos de clientes. O nível define o prazo da primeira resposta e quem é acionado.'
  },
  {
    quem:P3, cor:COR.soc, titulo:'Ciclo de resposta e CSIRT', sub:'ISO/IEC 27035 · NIST SP 800-61',
    sala:`<div class="s-corpo">
        <div class="tempo" style="--n:5">
          <div class="etapa" style="--cor:${COR.brand}"><span class="bola">1</span><h4>Preparação</h4><p>Ferramentas, playbooks e equipe prontos</p></div>
          <div class="etapa" style="--cor:${COR.soc}"><span class="bola">2</span><h4>Detecção e análise</h4><p>Alerta do Wazuh, triagem com a IA, ticket no ITSM</p></div>
          <div class="etapa" style="--cor:#F87171"><span class="bola">3</span><h4>Contenção</h4><p>Bloqueio no UniFi e reset de credenciais</p></div>
          <div class="etapa" style="--cor:${COR.end}"><span class="bola">4</span><h4>Erradicação e recuperação</h4><p>Remove a causa e restaura</p></div>
          <div class="etapa" style="--cor:${COR.grc}"><span class="bola">5</span><h4>Pós-incidente</h4><p>RCI em 5 dias úteis e lições aprendidas</p></div>
        </div>
        <div class="org">
          <div class="chefe"><h4>Coordenador do SOC</h4><p>Autoriza a contenção e coordena o CSIRT (níveis 3 e 4)</p></div>
          <div class="tronco"></div>
          <div class="ramos">
            <div class="membro" style="--cor:${COR.iam}"><h4>IAM</h4><p>Reseta senhas e revoga sessões</p></div>
            <div class="membro" style="--cor:${COR.net}"><h4>Network</h4><p>Bloqueia domínios e tráfego no UniFi</p></div>
            <div class="membro" style="--cor:${COR.end}"><h4>Endpoint</h4><p>Verifica a estação e faz reimagem se preciso</p></div>
            <div class="membro" style="--cor:${COR.grc}"><h4>GRC e DPO</h4><p>Notificam ANPD e BACEN</p></div>
            <div class="membro" style="--cor:#94A3B8"><h4>Jurídico</h4><p>Obrigações legais</p></div>
            <div class="membro" style="--cor:${COR.brand}"><h4>Diretoria</h4><p>CEO e CFO, comunicação externa</p></div>
          </div>
        </div>
      </div>`,
    notas:'No nosso phishing: detecção pelo Wazuh, triagem com a IA, ticket no ITSM e contenção pelos times. Como é nível 3, o CSIRT é acionado. Cada time tem um papel. Ninguém fala publicamente sobre o incidente sem a Diretoria. As lições aprendidas viram ajuste de regra no Wazuh.'
  },
  {
    quem:P3, cor:COR.soc, titulo:'Escalonamento: quem chama quem', sub:'POL-GI-001 · PB-010 · BIA-001 · cada degrau tem um gatilho para subir',
    sala:`<div class="s-corpo" style="justify-content:center">
        <div class="escada">
          <div class="bloco" style="--cor:#94A3B8"><span class="rot">Degrau 1 · detecção</span><h4>Wazuh e CyberFin IA</h4>
            <p>O Wazuh gera o alerta e a IA classifica. O aviso chega ao canal do SOC no Telegram.</p>
            <div class="rodape"><b>Sobe sempre:</b> alerta não é incidente; quem confirma é uma pessoa.</div></div>
          <div class="bloco" style="--cor:${COR.soc}"><span class="rot">Degrau 2 · triagem</span><h4>Analista do SOC</h4>
            <p>Confirma, registra o ticket no ITSM, coleta evidências e propõe o nível pela matriz.</p>
            <div class="rodape"><b>Sobe quando:</b> o incidente é confirmado, no prazo do nível (15 min a 2 h).</div></div>
          <div class="bloco" style="--cor:#FB923C"><span class="rot">Degrau 3 · decisão</span><h4>Coordenador do SOC</h4>
            <p>Define o nível, autoriza a contenção e aciona Network, IAM e Endpoint.</p>
            <div class="rodape"><b>Sobe quando:</b> nível 3 ou 4 (equivale a S2 e S1).</div></div>
          <div class="bloco" style="--cor:#F87171"><span class="rot">Degrau 4 · resposta</span><h4>CSIRT</h4>
            <p>SOC, IAM, Network, Endpoint, GRC e DPO, Jurídico. GRC e DPO avaliam ANPD; GRC e Jurídico, o BACEN.</p>
            <div class="rodape"><b>Sobe quando:</b> nível 4, dados de clientes acessados ou pagamento indevido.</div></div>
          <div class="bloco" style="--cor:${COR.brand}"><span class="rot">Degrau 5 · governança</span><h4>Diretoria Executiva</h4>
            <p>Aprova a comunicação externa e, por recomendação do CSIRT, <b>declara o desastre</b>.</p>
            <div class="rodape"><b>Dispara:</b> o plano de recuperação (DRP), na ordem do runbook.</div></div>
        </div>
        <div class="linha" style="grid-template-columns:1fr 1fr">
          <div class="bloco" style="--cor:${COR.soc}"><span class="rot">Atualizações durante a contenção</span>
            <p><b>Níveis 3 e 4:</b> a cada 15 min no canal do SOC. <b>Níveis 1 e 2:</b> a cada 30 a 60 min. Times técnicos por WhatsApp e canal técnico; GRC e Diretoria por e-mail e WhatsApp.</p></div>
          <div class="bloco" style="--cor:${COR.brand}"><span class="rot">Quem fala para fora</span>
            <p>Só o Coordenador do SOC e o GRC falam com regulador e cliente, e só a Diretoria fala com o público. Se o e-mail ou o AD estiverem comprometidos: telefone e WhatsApp.</p></div>
        </div>
      </div>`,
    notas:'Ler da esquerda para a direita, subindo. O alerta nasce no Wazuh e a IA classifica, mas quem confirma é o analista. O coordenador decide o nível e autoriza a contenção. Nível 3 ou 4 aciona o CSIRT; nível 4, dados de clientes ou pagamento indevido sobem à Diretoria, que é quem pode declarar o desastre e disparar o DRP. No nosso phishing: o analista confirmou, o coordenador classificou como nível 3 e o CSIRT foi acionado.'
  },
  {
    quem:P3, cor:COR.soc, titulo:'Zammad: como o SOC trata um incidente', sub:'zammadsrv · 10.10.50.17 · o CyberFin dá o contexto, o ticket registra a decisão humana',
    sala:`<div class="s-corpo" style="justify-content:center">
        <div class="linha" style="grid-template-columns:repeat(6, 1fr)">
          <div class="bloco" style="--cor:${COR.soc}"><span class="rot">1 · Detecção</span><p>Alerta do Wazuh ou do Zabbix, com a evidência original.</p></div>
          <div class="bloco" style="--cor:#FB923C"><span class="rot">2 · Triagem</span><p>Severidade, ativo, origem, regra, contexto e prioridade.</p></div>
          <div class="bloco" style="--cor:${COR.brand}"><span class="rot">3 · Investigação</span><p>Logs, correlações, histórico e o enriquecimento da IA.</p></div>
          <div class="bloco" style="--cor:#F87171"><span class="rot">4 · Contenção</span><p>Ação autorizada, como o Active Response temporário.</p></div>
          <div class="bloco" style="--cor:#4ADE80"><span class="rot">5 · Monitoramento</span><p>Confirmar que não voltou e o estado do ativo.</p></div>
          <div class="bloco" style="--cor:${COR.grc}"><span class="rot">6 · Encerramento</span><p>Classificar e registrar conclusão e evidências.</p></div>
        </div>
        <div class="linha" style="grid-template-columns:1fr 1fr">
          <div class="bloco" style="--cor:${COR.soc}"><span class="rot">Grupos no Zammad</span>
            <div class="chips2"><span>SOC-N1</span><span>SOC-N2</span><span>SOC-N3</span></div>
            <div class="chips2"><span>Network</span><span>Infrastructure</span><span>Systems</span><span>Applications</span><span>Security Engineering</span><span>Endpoint</span></div></div>
          <div class="bloco" style="--cor:${COR.grc}"><span class="rot">Como um ticket fecha</span>
            <div class="chips2"><span style="background:#3A1C21; color:#FCA5A5">Incidente real</span><span style="background:#1C2F42">Falso positivo</span><span style="background:#33270F; color:#F5D08A">Inconclusivo</span></div>
            <p>Sempre com a conclusão e as evidências registradas. É do histórico do ticket que saem os tempos de detecção e resposta.</p></div>
        </div>
        <div class="amb">${botoesAmbiente('ITSM · Zammad')}</div>
      </div>`,
    notas:'O Zammad é a camada operacional do SOC. O CyberFin normaliza, correlaciona e dá contexto; o ticket registra quem é o responsável, o que foi investigado e o que foi decidido. São seis fases, e os grupos SOC-N1, N2 e N3 definem quem trata em cada nível, com os grupos dos times técnicos acionados quando precisa. Todo ticket fecha com uma classificação: incidente real, falso positivo ou inconclusivo. Se der, abrir o Zammad e mostrar um ticket de verdade.'
  },
  {
    quem:P3, cor:COR.soc, titulo:'Tratamento do incidente: o ticket do início ao fim', sub:'Zammad (ITSM) · cenário simulado do PB-010 · cada ação fica registrada no ticket',
    sala:`<div class="s-corpo" style="justify-content:center">
        <div class="ticket">
          <div class="tk-cab">
            <span class="cod">INC-0001 · Zammad (ITSM)</span>
            <h4>Phishing em Contas a Pagar</h4>
            <dl><dt>Nível</dt><dd>3 · Alta</dd><dt>Playbook</dt><dd>PB-010</dd><dt>Origem</dt><dd>Wazuh + CyberFin IA</dd>
                <dt>Responsável</dt><dd>Analista do SOC</dd><dt>Contenção</dt><dd>Coordenador do SOC</dd><dt>Situação</dt><dd style="color:#4ADE80">Encerrado</dd></dl>
            <div class="kpi"><div><b>4 min</b><span>clique → alerta<br>meta MTTD &lt; 15 min</span></div><div><b>22 min</b><span>alerta → contenção<br>meta MTTR &lt; 30 min</span></div></div>
          </div>
          <div class="tk-linha">
            <div class="tk-ev" style="--cor:#F87171"><span class="h">09:12</span><span class="f">Entrada</span><p>Colaborador de Contas a Pagar clica no link do e-mail (VLAN 40).</p></div>
            <div class="tk-ev" style="--cor:${COR.soc}"><span class="h">09:16</span><span class="f">Detecção</span><p>Wazuh alerta a conexão ao domínio suspeito; a CyberFin IA classifica e avisa o SOC no Telegram.</p></div>
            <div class="tk-ev" style="--cor:${COR.soc}"><span class="h">09:20</span><span class="f">Registro</span><p>Analista confirma, abre o ticket no ITSM, anexa as evidências e propõe o nível 3.</p></div>
            <div class="tk-ev" style="--cor:#FB923C"><span class="h">09:24</span><span class="f">Decisão</span><p>Coordenador do SOC confirma o nível 3, autoriza a contenção e aciona o CSIRT.</p></div>
            <div class="tk-ev" style="--cor:#F87171"><span class="h">09:38</span><span class="f">Contenção</span><p>Domínio bloqueado no UniFi, senha resetada e sessões revogadas no AD, estação em verificação.</p></div>
            <div class="tk-ev" style="--cor:${COR.end}"><span class="h">11:40</span><span class="f">Erradicação</span><p>Busca do domínio em todos os agentes: nenhum outro host. Estação limpa após a varredura.</p></div>
            <div class="tk-ev" style="--cor:${COR.end}"><span class="h">D+1</span><span class="f">Recuperação</span><p>Estação de volta à rede; conta sob monitoramento reforçado por 7 dias.</p></div>
            <div class="tk-ev" style="--cor:${COR.grc}"><span class="h">D+5 úteis</span><span class="f">Pós-incidente</span><p>RCI entregue; nova regra no Wazuh para o domínio e treinamento de phishing em Contas a Pagar. Ticket encerrado.</p></div>
          </div>
        </div>
        ${botoesAmbiente('ITSM · Zammad')}
      </div>`,
    notas:'Este é o mesmo phishing da simulação, agora visto pelo ticket do ITSM. Cada fase do ciclo de resposta vira uma entrada com hora e responsável. É do ticket que saem os tempos: 4 minutos do clique ao alerta e 22 do alerta à contenção, dentro das metas da POL-GI-001. O tratamento só termina no pós-incidente, com o RCI em 5 dias úteis e a lição aprendida virando regra no Wazuh. Horários do cenário simulado.'
  },
  {
    quem:P3, cor:COR.soc, titulo:'Como medimos o SOC', sub:'Metas de desempenho da POL-GI-001',
    sala:`<div class="s-corpo" style="justify-content:center">
        <div class="linha" style="grid-template-columns:repeat(4, 1fr)">
          <div class="bloco" style="--cor:${COR.soc}"><span class="rot">MTTD</span><span class="grande">&lt; 15 min</span><p>Tempo médio para <b>detectar</b>, na infraestrutura crítica.</p></div>
          <div class="bloco" style="--cor:${COR.soc}"><span class="rot">MTTR</span><span class="grande">&lt; 30 min</span><p>Tempo médio para <b>responder</b> a incidentes alta e crítica.</p></div>
          <div class="bloco" style="--cor:${COR.soc}"><span class="rot">Falsos positivos</span><span class="grande">&lt; 10%</span><p>Alertas que não eram incidente. Ajustar as regras do Wazuh reduz esse número.</p></div>
          <div class="bloco" style="--cor:${COR.soc}"><span class="rot">RCIs no prazo</span><span class="grande">100%</span><p>Relatórios dos níveis 3 e 4 entregues em até 5 dias úteis.</p></div>

        <p class="s-txt">Apoio contínuo: <b>CyberFin IA</b> classificando os alertas 24/7, com a decisão final sempre do <b>analista</b>.</p>
      </div>`,
    notas:'Metas dão objetividade ao SOC. Falsos positivos importam porque um SOC que alerta demais é ignorado. Se perguntarem se as metas já são cumpridas: são metas da política, e o registro dos tickets no ITSM é o que permite medir os tempos. Fechar o bloco do SOC aqui.'
  },

  {

    notas:'As bolinhas amarelas são as cópias: saem dos servidores para o NT-003, onde roda o Veeam, e de lá vão para o repositório no TrueNAS, no ambiente externo. Por isso, se as VMs forem perdidas, os backups continuam lá. O Firefly tem um backup próprio, duas vezes por dia, já validado com SHA-256. Ser honesto: o restore real pelo Veeam e a cópia fora do ambiente ainda estão sendo validados.'
  },

  /* =================== SALA: continuidade, GRC, riscos, plano, aplicação =================== */
  {
    quem:P4, cor:COR.grc, titulo:'BIA: quatro serviços, quatro relógios', sub:'GRC-BIA-001 · quanto tempo cada serviço pode ficar parado',
    sala:`<div class="s-corpo" style="justify-content:center">
        <div class="linha" style="grid-template-columns:repeat(4, 1fr)">
          <div class="bloco" style="--cor:#F87171"><span class="rot" style="color:#F87171">Crítico · S1</span><h4>Operações de Crédito</h4>
            <div class="relogio"><div><b>2 h</b><span>RTO</span></div><div><b>15 min</b><span>RPO</span></div><div><b>6 h</b><span>MTPD</span></div></div>
            <p>Bloqueio de liquidez das PMEs, perda de receita de juros e sanções do Banco Central.</p></div>
          <div class="bloco" style="--cor:#FB923C"><span class="rot" style="color:#FB923C">Alto · S2</span><h4>BPO Financeiro</h4>
            <div class="relogio"><div><b>4 h</b><span>RTO</span></div><div><b>1 h</b><span>RPO</span></div><div><b>12 h</b><span>MTPD</span></div></div>
            <p>Atraso no pagamento de fornecedores dos clientes, multas e quebra de contrato.</p></div>
          <div class="bloco" style="--cor:#FB923C"><span class="rot" style="color:#FB923C">Alto · S2</span><h4>Folha de Pagamento</h4>
            <div class="relogio"><div><b>4 h</b><span>RTO</span></div><div><b>1 h</b><span>RPO</span></div><div><b>24 h</b><span>MTPD</span></div></div>
            <p>Salários de funcionários dos clientes sem pagamento e passivos trabalhistas.</p></div>
          <div class="bloco" style="--cor:#FACC15"><span class="rot" style="color:#FACC15">Médio-Baixo · S3-S4</span><h4>Valuation e M&amp;A</h4>
            <div class="relogio"><div><b>24 h</b><span>RTO</span></div><div><b>12 h</b><span>RPO</span></div><div><b>72 h</b><span>MTPD</span></div></div>
            <p>Atraso na entrega de relatórios de avaliação, sem impacto transacional imediato.</p></div>
        </div>
        <p class="s-txt"><b>RTO</b>: tempo máximo para voltar · <b>RPO</b>: perda máxima de dados · <b>MTPD</b>: a partir daqui o dano é inaceitável. Metas da BIA-001 e da POL-CN-001.</p>
      </div>`,
    notas:'A BIA do GRC define, para cada serviço, quanto tempo ele pode ficar parado e quanto dado pode ser perdido. Crédito é o mais sensível porque a Cyberappfin é uma SCD regulada pelo Banco Central: 2 horas para voltar e no máximo 15 minutos de dados perdidos. Se perguntarem como chegaram nos números: são metas definidas pela criticidade de cada serviço, e o teste de restauração é o que vai comprovar.'
  },
  {
    quem:P4, cor:COR.grc, titulo:'Os cinco pilares do impacto', sub:'GRC-BIA-001 · cenário de perda do ambiente, nível máximo nas primeiras 72 h',
    sala:`<div class="s-corpo" style="justify-content:center">
        <div class="calor">
          <span></span><span class="cab">Segurança física</span><span class="cab">Financeiro</span><span class="cab">Legislação e regulação</span><span class="cab">Operação</span><span class="cab">Reputação</span>
          <span class="srv">Crédito</span><span class="cel n3">3 Alto</span><span class="cel n4">4 Crítico</span><span class="cel n4">4 Crítico</span><span class="cel n4">4 Crítico</span><span class="cel n4">4 Crítico</span>
          <span class="srv">BPO Financeiro</span><span class="cel n3">3 Alto</span><span class="cel n4">4 Crítico</span><span class="cel n4">4 Crítico</span><span class="cel n4">4 Crítico</span><span class="cel n4">4 Crítico</span>
          <span class="srv">Folha</span><span class="cel n3">3 Alto</span><span class="cel n4">4 Crítico</span><span class="cel n4">4 Crítico</span><span class="cel n4">4 Crítico</span><span class="cel n4">4 Crítico</span>
          <span class="srv">Valuation e M&amp;A</span><span class="cel n3">3 Alto</span><span class="cel n2">2 Médio</span><span class="cel n3">3 Alto</span><span class="cel n2">2 Médio</span><span class="cel n2">2 Médio</span>

        <div class="marcos">
          <span></span>
          <p>A infraestrutura fica em ambiente externo (VLAN 200). Reconstruir depende do acesso liberado e de hardware novo.</p>
          <p>Param o faturamento e o crédito operado. O pagamento segue autorizado só pelo cliente, com token próprio.</p>
          <p>Como SCD, a parada de crédito leva GRC e Jurídico ao BACEN. Envolve LGPD, sigilo bancário (LC 105/2001) e PLD.</p>
          <p>Param contas a pagar e a receber, conciliação, crédito, cobrança e a Folha; o monitoramento do SOC cai junto.</p>
          <p>O cliente vem pela confiança na holding: um desastre atinge as duas marcas. Só a Diretoria fala com o público.</p>

      </div>`,
    notas:'Os cinco pilares são as dimensões em que a BIA mede o impacto: segurança física, financeiro, legislação e regulação, operação e reputação. Crédito, BPO e Folha chegam ao crítico em quatro das cinco; Valuation é o menos sensível. Por ser uma SCD regulada, o pilar regulatório é o que leva mais rápido ao Banco Central. Depois de 72 h sem recuperação, Valuation também chega ao crítico no financeiro e na operação.'
  },
  {
    quem:P4, cor:COR.grc, titulo:'O impacto cresce a cada hora', sub:'GRC-BIA-001 · cenário de perda do ambiente, nível de impacto ao longo do tempo',

        <p class="s-rot" style="color:#8DB6F9">Cyberappfin · Defesa Cibernética · Impacta</p>
        <h2 class="gigante">Obrigado!</h2>
        <p class="s-txt" style="font-size:clamp(26px, 2.6vw, 48px); color:var(--text); font-family:'Sora', system-ui, sans-serif; font-weight:700">Perguntas?</p>
        <div class="faixa"></div>
        <div class="lema2"><span>Segurança</span><span>·</span><span>Resiliência</span><span>·</span><span>Controle</span></div>
      </div>`,
    notas:'Agradecer em nome do grupo e abrir para perguntas. Se pedirem para ver algo do ambiente, voltar à parada correspondente (o endereço #número abre direto).'
  }
];

/* ---------- navegação ---------- */
const $ = id => document.getElementById(id);
let atual = 0;

function montarPontos(){
  $('pontos').innerHTML = '';
  PARADAS.forEach((p, i) => {
    const b = document.createElement('button');
    b.setAttribute('aria-label', `Ir para ${i + 1}: ${p.titulo}`);
    b.title = p.titulo;
    b.addEventListener('click', () => ir(i));
    $('pontos').appendChild(b);
  });
}

async function rodarIncidente(passo){
  const minha = geracao;
  const ws = hostCentro(3, 0), wz = hostCentro(4, 0), ia = hostCentro(4, 3), it = hostCentro(4, 4), ad = hostCentro(1, 0);
  resetIncidente();
  if(passo === 0){
    // e-mail de phishing: SD-WAN -> UniFi -> Cisco -> workstation da VLAN 40
    await pacote([{x:120,y:170},{x:300,y:170},{x:460,y:172},{x:700,y:170},{x:820,y:170},{x:820,y:BUS_Y},{x:LANE(3),y:BUS_Y},{x:LANE(3),y:ws.y},ws], COR.danger, 3200, 9);
    if(minha === geracao){ WS.classList.add('alerta'); selo(WS, 'CLICOU', COR.danger); }
    return;
  }
  if(passo >= 4){
    selo(ITSM, passo === 4 ? 'INC ABERTO' : 'RESOLVIDO', passo === 4 ? '#FCD34D' : '#4ADE80');
    WS.classList.add('ok'); selo(WS, passo === 4 ? 'VARREDURA' : 'RECUPERADA', '#4ADE80');
    const wz = hostCentro(4, 0);
    if(passo === 4){
      // busca do domínio malicioso nos logs de todos os agentes
      const agentes = [hostCentro(1,0), hostCentro(1,1), hostCentro(2,0), hostCentro(4,1), hostCentro(4,2)];
      emLoop(() => agentes.forEach((a, k) => setTimeout(() => pacote(viaBus(wz, a), '#FB923C', 1500, 6), k * 260)), 3200);
    } else {
      // monitoramento reforçado: a estação volta a mandar logs ao Wazuh
      emLoop(() => pacote(viaBus(ws, wz), COR.end, 1600, 7), 2200);
    }
    return;
  }
  WS.classList.add('alerta');
  selo(WS, 'SUSPEITA', COR.danger);
  if(passo === 1){
    // detecção no Wazuh e classificação pela CyberFin IA
    emLoop(async () => { if(await pacote(viaBus(ws, wz), COR.danger, 1500, 7)) pacote(viaBus(wz, ia), '#FCA5A5', 900, 6); }, 3000);
  }
  if(passo === 2){
    // analista confirma: ticket no ITSM
    emLoop(async () => { if(await pacote(viaBus(ia, it), '#FCD34D', 900, 7) && minha === geracao) selo(ITSM, 'INC ABERTO', '#FCD34D'); }, 2400);
  }
  if(passo === 3){
    // contenção: Network bloqueia no UniFi, IAM reseta a credencial, Endpoint verifica a estação
    selo(ITSM, 'INC ABERTO', '#FCD34D');
    emLoop(() => {
      pacote([it, {x:LANE(4),y:it.y}, {x:LANE(4),y:BUS_Y}, {x:820,y:BUS_Y}, {x:820,y:170}, {x:620,y:170}, {x:460,y:172}], COR.net, 2000, 7);
      setTimeout(() => pacote(viaBus(it, ad), COR.iam, 1800, 7), 400);
      setTimeout(() => pacote(viaBus(it, ws), COR.end, 1600, 7), 800);
    }, 3400);
    setTimeout(() => { if(minha === geracao){ WS.classList.remove('alerta'); selo(WS, 'CONTIDA', COR.end); } }, 2600);
  }
}

function ir(i){
  i = Math.max(0, Math.min(PARADAS.length - 1, i));
  const p = PARADAS[i];
  const anterior = PARADAS[atual];
  const avancando = i > atual;
  atual = i;
  limparAnimacoes();

  // o estado da simulação só existe nas paradas do incidente
  resetIncidente();

  $('quem').textContent = p.quem;
  $('quem').hidden = !p.quem;
  $('quem').style.color = p.cor;
  $('titulo').textContent = p.titulo;
  $('subtitulo').textContent = p.sub || '';
  $('conteudo').innerHTML = p.html || '';
  $('conteudo').scrollTop = 0;
  $('notas').textContent = p.notas || '';

  // foto do prédio: capa (foto:true), fundo escuro (foto:'fundo') e,
  // ao sair dela para o mapa, o zoom de "entrar no prédio"
  const corpo = document.body;
  corpo.classList.remove('entrando');
  if(anterior && anterior.foto && !p.foto && !p.sala && avancando){
    corpo.classList.remove('com-foto', 'foto-fundo');
    void corpo.offsetWidth; // reinicia a animação
    corpo.classList.add('entrando');
    const minhaEntrada = geracao;
    setTimeout(() => { if(minhaEntrada === geracao) corpo.classList.remove('entrando'); }, 1650);
  } else {
    corpo.classList.toggle('com-foto', p.foto === true);
    corpo.classList.toggle('foto-fundo', p.foto === 'fundo');
  }

  // modo sala (processo e gestão) ou modo mapa (técnico)
  const sala = !!p.sala;
  document.body.classList.toggle('modo-sala', sala);
  if(sala){
    $('sala').innerHTML = `<div class="s-head">
        ${p.quem ? `<span class="s-quem" style="color:${p.cor}">${p.quem}</span>` : ''}
        ${p.titulo !== 'Cyberappfin' && p.titulo !== 'Encerramento' ? `<h2 class="s-titulo">${p.titulo}</h2>` : ''}
        ${p.sub ? `<p class="s-sub">${p.sub}</p>` : ''}
      </div>${p.sala}`;
    $('sala').scrollTop = 0;
  }

  camera(sala ? MUNDO : (p.cam || MUNDO));
  focar(sala ? null : p.foco);
  // os pacotes só saem depois que a câmera termina de se mover, para não "se perderem"
  const minha = geracao;
  setTimeout(() => {
    if(minha !== geracao) return;
    if(p.anim) p.anim();
    if(p.incidente !== undefined) rodarIncidente(p.incidente);
    if(p.dr !== undefined) rodarDR(p.dr);
  }, sala ? 0 : (corpo.classList.contains('entrando') ? 1900 : 950));

  $('contador').textContent = `${i + 1} / ${PARADAS.length}`;
  [...$('pontos').children].forEach((b, k) => {
    b.classList.toggle('atual', k === i);
    b.classList.toggle('feito', k < i);
  });
  try{ history.replaceState(null, '', '#' + (i + 1)); }catch(e){}
}

$('ant').addEventListener('click', () => ir(atual - 1));
$('prox').addEventListener('click', () => ir(atual + 1));
document.addEventListener('keydown', e => {
  if(e.target.closest && e.target.closest('button') && (e.key === ' ' || e.key === 'Enter')) return;
  if(['ArrowRight', 'PageDown', ' '].includes(e.key)){ e.preventDefault(); ir(atual + 1); }
  else if(['ArrowLeft', 'PageUp'].includes(e.key)){ e.preventDefault(); ir(atual - 1); }
  else if(e.key === 'Home') ir(0);
  else if(e.key === 'End') ir(PARADAS.length - 1);
  else if(e.key === 'n' || e.key === 'N') document.body.classList.toggle('com-notas');
  else if(e.key === 'b' || e.key === 'B' || e.key === '.') document.body.classList.toggle('tela-preta');
  else if(e.key === 'f' || e.key === 'F'){
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.();
  }
});

// cursor escondido quando o mouse fica parado (não aparece no projetor)
let timerCursor = null;
document.addEventListener('mousemove', () => {
  document.body.classList.remove('sem-cursor');
  clearTimeout(timerCursor);
  timerCursor = setTimeout(() => document.body.classList.add('sem-cursor'), 2500);
});

// o endereço #N abre direto na parada N (útil para ensaiar uma parte)
function paradaDoEndereco(){
  const n = parseInt(location.hash.slice(1), 10);
  return Number.isFinite(n) ? n - 1 : 0;
}
window.addEventListener('hashchange', () => { if(paradaDoEndereco() !== atual) ir(paradaDoEndereco()); });

montarPontos();
ir(paradaDoEndereco());
</script>
