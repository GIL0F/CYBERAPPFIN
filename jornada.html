<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyberappfin: a jornada do pacote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1520; --bg-2:#101E2C; --panel:#13212F; --line:#26384A; --line-2:#344B61;
    --text:#EEF3F8; --muted:#9FB1C3; --soft:#C7D4E1;
    --net:#14B8A6; --iam:#8B5CF6; --soc:#F59E0B; --end:#22C55E; --grc:#EAB308;
    --brand:#4C8DF6; --danger:#F87171;
    --panel-w:560px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; background:var(--bg); color:var(--text); font-family:'DM Sans', system-ui, sans-serif; overflow:hidden; }
  .mono{ font-family:'JetBrains Mono', ui-monospace, monospace; }

  /* ---------- palco ---------- */
  #stage{ position:fixed; inset:0 var(--panel-w) 64px 0; }
  #mapa{ width:100%; height:100%; display:block; }
  #mapa text{ font-family:'DM Sans', system-ui, sans-serif; fill:var(--text); }
  #mapa .t-title{ font-family:'Sora', system-ui, sans-serif; font-weight:700; }
  #mapa .t-mono{ font-family:'JetBrains Mono', ui-monospace, monospace; fill:var(--muted); }
  #mapa .t-muted{ fill:var(--muted); }
  .no{ transition:opacity .45s ease; }
  body.focando .no{ opacity:.18; }
  body.focando .no.foco{ opacity:1; }
  .lig{ fill:none; stroke:var(--line-2); stroke-width:2.5; }
  .lig.trac{ stroke-dasharray:7 7; }
  .barramento{ fill:none; stroke:#3E5A75; stroke-width:7; stroke-linecap:round; }
  .host rect{ transition:stroke .3s, fill .3s; }
  .host.alerta rect{ stroke:var(--danger) !important; fill:#3A1C21 !important; }
  .pulso{ animation:pulso 1.4s ease-in-out infinite; }
  @keyframes pulso{ 0%,100%{ opacity:1 } 50%{ opacity:.35 } }

  /* ---------- painel lateral ---------- */
  #painel{
    position:fixed; top:0; right:0; bottom:64px; width:var(--panel-w);
    background:var(--panel); border-left:1px solid var(--line);
    display:flex; flex-direction:column; overflow:hidden;
  }
  #painel .topo{ padding:28px 36px 0; display:flex; flex-direction:column; gap:10px; }
  #quem{ align-self:flex-start; font-size:13px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
         padding:6px 12px; border-radius:999px; background:#1C2F42; color:var(--soft); }
  #painel h1{ font-family:'Sora', system-ui, sans-serif; font-size:32px; line-height:1.15; font-weight:700; }
  #painel .sub{ color:var(--muted); font-size:16px; }
  #conteudo{ padding:20px 36px 32px; overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:16px; }
  #conteudo p{ font-size:17px; line-height:1.55; color:var(--soft); }
  #conteudo b{ color:var(--text); }
  #conteudo h3{ font-family:'Sora', system-ui, sans-serif; font-size:15px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-top:6px; }
  #conteudo ul{ list-style:none; display:flex; flex-direction:column; gap:8px; }
  #conteudo li{ font-size:16.5px; line-height:1.45; color:var(--soft); padding-left:18px; position:relative; }
  #conteudo li::before{ content:""; position:absolute; left:0; top:.6em; width:7px; height:7px; border-radius:50%; background:var(--cor, var(--brand)); }
  #conteudo table{ width:100%; border-collapse:collapse; font-size:15px; }
  #conteudo th{ text-align:left; color:var(--muted); font-weight:700; padding:7px 8px; border-bottom:1px solid var(--line-2); }
  #conteudo td{ padding:7px 8px; border-bottom:1px solid var(--line); color:var(--soft); vertical-align:top; }
  #conteudo tr.dest td{ color:var(--text); background:#2A2112; }
  #conteudo tr.perigo td{ color:var(--text); background:#2C1A1E; }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{ font-size:14px; padding:5px 11px; border-radius:999px; background:#1C2F42; color:var(--soft); }
  .cards{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .card{ background:var(--bg-2); border:1px solid var(--line); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:4px; }
  .card .n{ font-family:'Sora', system-ui, sans-serif; font-size:28px; font-weight:800; color:var(--cor, var(--brand)); line-height:1.1; }
  .card .l{ font-size:14px; color:var(--muted); }
  .barras{ display:flex; flex-direction:column; gap:7px; }
  .barra{ display:grid; grid-template-columns:100px 1fr 44px; align-items:center; gap:10px; font-size:15px; color:var(--soft); }
  .barra i{ display:block; height:14px; border-radius:4px; }
  .aviso{ font-size:14px; color:#F5B95A; border-left:3px solid #F5B95A; padding:6px 10px; background:#241C10; border-radius:0 8px 8px 0; }
  .passos{ display:flex; flex-direction:column; gap:8px; counter-reset:p; }
  .passo{ display:flex; gap:12px; align-items:flex-start; font-size:16px; color:var(--muted); transition:color .3s; }
  .passo::before{ counter-increment:p; content:counter(p); flex-shrink:0; width:26px; height:26px; border-radius:50%;
                  display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; background:#1C2F42; color:var(--muted); }
  .passo.ativo{ color:var(--text); }
  .passo.ativo::before{ background:var(--danger); color:#1A0E10; }
  #notas{ display:none; margin:0 36px 20px; padding:14px 16px; background:#0E1A26; border:1px dashed var(--line-2); border-radius:10px;
          font-size:15px; line-height:1.5; color:var(--soft); max-height:34%; overflow-y:auto; }
  body.com-notas #notas{ display:block; }

  /* ---------- telas cheias (abertura e encerramento) ---------- */
  #tela{
    position:fixed; inset:0 var(--panel-w) 64px 0; display:flex; flex-direction:column; justify-content:center;
    padding:6vh 6vw; gap:28px; background:radial-gradient(ellipse at 25% 40%, #12243A 0%, #0B1520 70%);
    opacity:0; pointer-events:none; transition:opacity .5s ease;
  }
  #tela.on{ opacity:1; }
  #tela .eyebrow{ font-size:16px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:#8DB6F9; }
  #tela h2{ font-family:'Sora', system-ui, sans-serif; font-size:clamp(44px, 6vw, 96px); font-weight:800; line-height:1.02; letter-spacing:-.02em; }
  #tela .lema{ display:flex; gap:18px; flex-wrap:wrap; font-family:'Sora', system-ui, sans-serif; font-size:clamp(20px, 2vw, 30px); font-weight:700; color:var(--soft); }
  #tela .lema span:nth-child(even){ color:#4B6580; }
  #tela .faixa{ height:6px; width:min(520px, 60%); border-radius:3px; background:linear-gradient(90deg, var(--brand), var(--iam), var(--net), var(--soc), var(--end)); }

  /* ---------- rodapé de navegação ---------- */
  #rodape{
    position:fixed; left:0; right:0; bottom:0; height:64px; background:#09121B; border-top:1px solid var(--line);
    display:flex; align-items:center; gap:20px; padding:0 24px;
  }
  #rodape button{ background:#1A2B3C; color:var(--text); border:1px solid var(--line-2); border-radius:10px;
                  font:600 15px 'DM Sans', system-ui, sans-serif; padding:9px 16px; cursor:pointer; }
  #rodape button:hover{ background:#22384D; }
  #rodape button:focus-visible{ outline:2px solid var(--brand); outline-offset:2px; }
  #pontos{ flex:1; display:flex; gap:6px; align-items:center; overflow:hidden; }
  #pontos button{ flex:1; min-width:6px; height:8px; padding:0; border-radius:4px; border:none; background:#22384D; }
  #pontos button.feito{ background:#3D5F82; }
  #pontos button.atual{ background:var(--brand); height:12px; }
  #contador{ font-size:15px; color:var(--muted); min-width:64px; text-align:right; }
  #dica{ font-size:13px; color:#5F7790; }

  @media (max-width:1100px){
    :root{ --panel-w:420px; }
    #painel h1{ font-size:26px; }
  }
  @media (max-width:760px){
    #stage{ inset:0 0 55vh 0; }
    #tela{ inset:0 0 55vh 0; }
    #painel{ top:45vh; width:100%; border-left:none; border-top:1px solid var(--line); }
    #dica{ display:none; }
  }
  @media (prefers-reduced-motion: reduce){
    .pulso{ animation:none; }
  }
</style>
</head>
<body>

<div id="stage">
  <svg id="mapa" viewBox="0 0 1600 920" preserveAspectRatio="xMidYMid meet" aria-label="Topologia da Cyberappfin"></svg>
</div>

<div id="tela" aria-live="polite"></div>

<aside id="painel">
  <div class="topo">
    <span id="quem"></span>
    <h1 id="titulo"></h1>
    <p class="sub" id="subtitulo"></p>
  </div>
  <div id="conteudo"></div>
  <div id="notas"></div>
</aside>

<nav id="rodape" aria-label="Navegação da apresentação">
  <button id="ant" aria-label="Parada anterior">← Anterior</button>
  <div id="pontos"></div>
  <span id="contador"></span>
  <button id="prox" aria-label="Próxima parada">Próxima →</button>
  <span id="dica">← → navega · N notas · F tela cheia</span>
</nav>

<script>
/* =====================================================================
   Cyberappfin: a jornada do pacote
   Fonte dos dados: ambiente-bpo (inventário), plano V2 de provisionamento,
   relatório OpenVAS de 11/09/2026 e as políticas POL-GI-001 / POL-CN-001.
   ===================================================================== */

const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('mapa');
const MUNDO = [0, 0, 1600, 920];

const COR = { net:'#14B8A6', iam:'#8B5CF6', soc:'#F59E0B', end:'#22C55E', grc:'#EAB308', brand:'#4C8DF6', danger:'#F87171', cinza:'#64809B' };

/* ---------- VLANs e hosts ---------- */
const VLANS = [
  { n:10, uso:'Gerência',   rede:'10.10.10.0/24', cor:COR.brand, hosts:[['UniFi (gestão)','10.10.10.x'],['vCenter 8.x','10.10.10.x'],['Notebook Admin','10.10.10.x']] },
  { n:20, uso:'Servidores', rede:'10.10.20.0/24', cor:COR.iam,   hosts:[['AD-01','10.10.20.10'],['AD-02','10.10.20.11']] },
  { n:30, uso:'DMZ',        rede:'10.10.30.0/24', cor:COR.danger, hosts:[['Reverse Proxy','10.10.30.3']] },
  { n:40, uso:'Usuários',   rede:'10.10.40.0/24', cor:COR.end,   hosts:[['W10','10.10.40.x'],['W10-2','10.10.40.x'],['WIN-10','10.10.40.x']] },
  { n:50, uso:'Segurança / SOC', rede:'10.10.50.0/24', cor:COR.soc, hosts:[['Wazuh Manager','10.10.50.21'],['Zabbix + Grafana','10.10.50.15'],['OpenVAS','10.10.50.7'],['Jump Server / PAM','10.10.50.x']] },
  { n:60, uso:'Backup',     rede:'10.10.60.0/24', cor:COR.grc,   hosts:[['Backup Server','10.10.60.x']] },
  { n:70, uso:'PCI / CDE',  rede:'10.10.70.0/24', cor:'#F472B6', hosts:[['PCI-APP-01','10.10.70.x']] },
  { n:80, uso:'vSphere DR', rede:'10.10.80.0/24', cor:'#60A5FA', hosts:[['vSphere DR','10.10.80.x']] },
  { n:99, uso:'Quarentena', rede:'10.10.99.0/24', cor:'#C084FC', hosts:[] }
];
const COL_X = i => 20 + i * 174;          // canto esquerdo da coluna
const COL_CX = i => COL_X(i) + 80;        // centro da coluna
const HOST_Y = j => 500 + j * 70;         // topo do host
const hostCentro = (i, j) => ({ x: COL_CX(i), y: HOST_Y(j) + 29 });
const BUS_Y = 360;

/* ---------- desenho ---------- */
function el(tag, attrs = {}, pai = svg){
  const e = document.createElementNS(NS, tag);
  for(const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  pai.appendChild(e);
  return e;
}
function texto(pai, x, y, str, attrs = {}){
  const t = el('text', { x, y, ...attrs }, pai);
  t.textContent = str;
  return t;
}
function grupo(id, extra = ''){
  return el('g', { 'data-id': id, class: 'no ' + extra });
}

// fundo com grade suave
const defs = el('defs');
defs.innerHTML = `
  <pattern id="grade" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#132332" stroke-width="1"/>
  </pattern>
  <filter id="brilho" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>`;
el('rect', { x:-2000, y:-2000, width:5600, height:4920, fill:'url(#grade)' });

// rótulos de camada
texto(svg, 30, 30, 'PERÍMETRO E VIRTUALIZAÇÃO', { class:'t-mono', 'font-size':13, 'letter-spacing':2 });
texto(svg, 30, 395, 'VLANs · TRUNK 802.1Q', { class:'t-mono', 'font-size':13, 'letter-spacing':2 });

// ligações do perímetro (desenhadas antes das caixas)
const gLig = grupo('ligacoes');
el('path', { d:'M200 100 C250 100 250 140 300 140', class:'lig trac' }, gLig);
el('path', { d:'M200 230 C250 230 250 200 300 200', class:'lig trac' }, gLig);
el('path', { d:'M600 170 H700', class:'lig' }, gLig);
el('path', { d:'M940 170 H1040', class:'lig' }, gLig);
el('path', { d:`M820 225 V${BUS_Y}`, class:'lig' }, gLig);

// WAN1 / WAN2
[['wan1', 60, 'WAN1', 'Link principal'], ['wan2', 190, 'WAN2', 'Link de backup']].forEach(([id, y, nome, sub]) => {
  const g = grupo(id);
  el('rect', { x:30, y, width:170, height:80, rx:40, fill:'#12263A', stroke:COR.net, 'stroke-width':2 }, g);
  texto(g, 115, y + 36, nome, { 'text-anchor':'middle', class:'t-title', 'font-size':20 });
  texto(g, 115, y + 58, sub, { 'text-anchor':'middle', class:'t-muted', 'font-size':14 });
});

// UniFi
(() => {
  const g = grupo('unifi');
  el('rect', { x:300, y:95, width:300, height:150, rx:16, fill:'#10283A', stroke:COR.net, 'stroke-width':2.5 }, g);
  texto(g, 324, 135, 'UniFi Controller', { class:'t-title', 'font-size':24 });
  texto(g, 324, 165, 'Firewall · NAT · VLANs · APs', { class:'t-muted', 'font-size':15 });
  texto(g, 324, 189, 'Gestão de switches e Wi-Fi', { class:'t-muted', 'font-size':15 });
  texto(g, 324, 222, 'VM Ubuntu 22.04 · VLAN 10', { class:'t-mono', 'font-size':13 });
})();

// Cisco 2960
(() => {
  const g = grupo('cisco');
  el('rect', { x:700, y:115, width:240, height:110, rx:16, fill:'#10283A', stroke:COR.net, 'stroke-width':2.5 }, g);
  texto(g, 722, 153, 'Cisco 2960', { class:'t-title', 'font-size':22 });
  texto(g, 722, 180, 'Layer 2 · VLANs', { class:'t-muted', 'font-size':15 });
  texto(g, 722, 204, 'Trunks 802.1Q', { class:'t-muted', 'font-size':15 });
})();

// Cluster vSphere
(() => {
  const g = grupo('cluster');
  el('rect', { x:1040, y:60, width:530, height:240, rx:18, fill:'#0F2133', stroke:COR.brand, 'stroke-width':2.5 }, g);
  texto(g, 1062, 92, 'Cluster vSphere HA', { class:'t-title', 'font-size':20 });
  texto(g, 1548, 92, 'vCenter 8.x', { class:'t-mono', 'font-size':13, 'text-anchor':'end' });
  [['ESX-01', 1060, 'Serviços internos', 'AD · Backup · PCI-APP'], ['ESX-02', 1310, 'SOC · DMZ · OpenVAS', 'EDR · Laboratório']].forEach(([n, x, a, b]) => {
    el('rect', { x, y:110, width:240, height:170, rx:12, fill:'#132A40', stroke:'#2E4E70', 'stroke-width':1.5 }, g);
    texto(g, x + 18, 142, n, { class:'t-title', 'font-size':20 });
    texto(g, x + 18, 170, a, { class:'t-muted', 'font-size':14 });
    texto(g, x + 18, 191, b, { class:'t-muted', 'font-size':14 });
    texto(g, x + 18, 226, '16 cores · 128 GB ECC', { class:'t-mono', 'font-size':12 });
    texto(g, x + 18, 246, '2x480 GB cache + 4x2 TB', { class:'t-mono', 'font-size':12 });
    texto(g, x + 18, 266, '2x10GbE + 2x10GbE vMotion', { class:'t-mono', 'font-size':12 });
  });
})();

// Barramento (trunk) e colunas de VLAN
const gBus = grupo('barramento');
el('path', { d:`M${COL_CX(0)} ${BUS_Y} H${COL_CX(8)}`, class:'barramento' }, gBus);
VLANS.forEach((v, i) => el('path', { d:`M${COL_CX(i)} ${BUS_Y} V400`, class:'lig' }, gBus));

const hostEls = {};   // "col-indice" -> <g>
VLANS.forEach((v, i) => {
  const g = grupo('vlan' + v.n);
  const x = COL_X(i);
  el('rect', { x, y:400, width:160, height:500, rx:14, fill:'#0F1D2B', stroke:v.cor, 'stroke-width':2, 'stroke-opacity':.75 }, g);
  el('rect', { x, y:400, width:160, height:6, rx:3, fill:v.cor }, g);
  texto(g, x + 14, 444, String(v.n), { class:'t-title', 'font-size':30, fill:v.cor });
  texto(g, x + 14, 466, v.uso, { 'font-size':14, 'font-weight':700 });
  texto(g, x + 14, 485, v.rede, { class:'t-mono', 'font-size':11 });
  v.hosts.forEach(([nome, ip], j) => {
    const h = el('g', { class:'host', 'data-host': `${i}-${j}` }, g);
    el('rect', { x:x + 10, y:HOST_Y(j), width:140, height:58, rx:9, fill:'#16283A', stroke:'#2C4560', 'stroke-width':1.5 }, h);
    texto(h, x + 20, HOST_Y(j) + 25, nome, { 'font-size':14, 'font-weight':700 });
    texto(h, x + 20, HOST_Y(j) + 45, ip, { class:'t-mono', 'font-size':11 });
    hostEls[`${i}-${j}`] = h;
  });
});
// vazio da quarentena
const gQ = svg.querySelector('[data-id="vlan99"]');
texto(gQ, COL_CX(8), 640, 'isolamento', { 'text-anchor':'middle', class:'t-muted', 'font-size':14 });
texto(gQ, COL_CX(8), 660, 'de host suspeito', { 'text-anchor':'middle', class:'t-muted', 'font-size':14 });

// camada de animações (pacotes) por cima de tudo
const camada = el('g', { id:'camada' });

/* ---------- pacotes animados ---------- */
let geracao = 0;          // muda a cada parada: cancela animações antigas
const loops = [];
function limparAnimacoes(){
  geracao++;
  loops.length = 0;
  camada.innerHTML = '';
}
// caminho em "L" passando pelo barramento: host -> trunk -> host
function viaBus(a, b){
  if(a.x === b.x) return [a, b];
  return [a, { x:a.x, y:BUS_Y }, { x:b.x, y:BUS_Y }, b];
}
function pacote(pontos, cor, dur = 1600, raio = 7){
  const minha = geracao;
  return new Promise(resolve => {
    const d = 'M' + pontos.map(p => `${p.x} ${p.y}`).join(' L');
    const trilha = el('path', { d, fill:'none', stroke:cor, 'stroke-width':2, 'stroke-opacity':.35, 'stroke-dasharray':'4 6' }, camada);
    const c = el('circle', { r:raio, fill:cor, filter:'url(#brilho)' }, camada);
    const total = trilha.getTotalLength();
    const reduzir = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const t0 = performance.now();
    function quadro(t){
      if(minha !== geracao){ resolve(false); return; }
      const k = reduzir ? 1 : Math.min(1, (t - t0) / dur);
      const p = trilha.getPointAtLength(total * k);
      c.setAttribute('cx', p.x); c.setAttribute('cy', p.y);
      if(k < 1) requestAnimationFrame(quadro);
      else { setTimeout(() => { trilha.remove(); c.remove(); resolve(true); }, 250); }
    }
    requestAnimationFrame(quadro);
  });
}
// repete um conjunto de pacotes enquanto a parada estiver ativa
function emLoop(fn, intervalo){
  const minha = geracao;
  (async function volta(){
    while(minha === geracao){
      fn();
      await new Promise(r => setTimeout(r, intervalo));
    }
  })();
}

/* ---------- câmera (viewBox animado) ---------- */
let vbAtual = [...MUNDO];
let animCam = null;
function camera(alvo, dur = 900){
  const ini = [...vbAtual];
  const t0 = performance.now();
  cancelAnimationFrame(animCam);
  const ease = k => k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
  const reduzir = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function quadro(t){
    const k = reduzir ? 1 : Math.min(1, (t - t0) / dur);
    vbAtual = ini.map((v, i) => v + (alvo[i] - v) * ease(k));
    svg.setAttribute('viewBox', vbAtual.join(' '));
    if(k < 1) animCam = requestAnimationFrame(quadro);
  }
  animCam = requestAnimationFrame(quadro);
}

/* ---------- foco ---------- */
function focar(ids){
  document.querySelectorAll('.no.foco').forEach(e => e.classList.remove('foco'));
  if(!ids || !ids.length){ document.body.classList.remove('focando'); return; }
  document.body.classList.add('focando');
  ids.forEach(id => svg.querySelector(`[data-id="${id}"]`)?.classList.add('foco'));
}

/* ---------- incidente: estação W10 indo para a quarentena ---------- */
const W10 = hostEls['3-0'];
function resetW10(){
  W10.classList.remove('alerta');
  W10.removeAttribute('transform');
  W10.querySelector('.selo')?.remove();
}
function moverW10ParaQuarentena(){
  const dx = COL_X(8) - COL_X(3), dur = 1400, t0 = performance.now();
  const minha = geracao;
  // a estação precisa ficar acima da coluna da quarentena enquanto se move
  svg.insertBefore(W10, camada);
  function quadro(t){
    if(minha !== geracao) return;
    const k = Math.min(1, (t - t0) / dur);
    const e = k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2) / 2;
    W10.setAttribute('transform', `translate(${dx * e} 0)`);
    if(k < 1) requestAnimationFrame(quadro);
    else {
      const s = el('text', { x:COL_X(3) + 20, y:HOST_Y(0) - 10, class:'selo pulso', 'font-size':13, 'font-weight':700, fill:COR.danger }, W10);
      s.textContent = 'ISOLADO';
    }
  }
  requestAnimationFrame(quadro);
}
function devolverW10(){
  resetW10();
  svg.querySelector('[data-id="vlan40"]').appendChild(W10);
}

/* ---------- navegação ---------- */
const $ = id => document.getElementById(id);
let atual = 0;

function montarPontos(){
  $('pontos').innerHTML = '';
  PARADAS.forEach((p, i) => {
    const b = document.createElement('button');
    b.setAttribute('aria-label', `Ir para ${i + 1}: ${p.titulo}`);
    b.title = p.titulo;
    b.addEventListener('click', () => ir(i));
    $('pontos').appendChild(b);
  });
}

async function rodarIncidente(passo){
  const minha = geracao;
  const w10 = hostCentro(3, 0), wz = hostCentro(4, 0);
  if(passo === 0){
    resetW10();
    await pacote([{x:115,y:100},{x:200,y:100},{x:300,y:140},{x:450,y:170},{x:700,y:170},{x:820,y:170},{x:820,y:BUS_Y},{x:w10.x,y:BUS_Y},w10], COR.danger, 3200, 9);
    if(minha === geracao) W10.classList.add('alerta');
  }
  if(passo === 1){
    W10.classList.add('alerta');
    emLoop(() => pacote(viaBus(w10, wz), COR.danger, 1400, 7), 1700);
  }
  if(passo === 2){
    W10.classList.add('alerta');
    moverW10ParaQuarentena();
  }
}

function ir(i){
  i = Math.max(0, Math.min(PARADAS.length - 1, i));
  const p = PARADAS[i];
  atual = i;
  limparAnimacoes();

  // estação W10 volta ao lugar; os passos 2 e 3 do incidente a movem de novo
  devolverW10();
  if(p.incidente === 3){ W10.classList.add('alerta'); moverW10ParaQuarentena(); }

  $('quem').textContent = p.quem;
  $('quem').style.color = p.cor;
  $('titulo').textContent = p.titulo;
  $('subtitulo').textContent = p.sub || '';
  $('conteudo').innerHTML = p.html;
  $('conteudo').scrollTop = 0;
  $('notas').textContent = p.notas || '';
  $('tela').innerHTML = p.tela || '';
  $('tela').classList.toggle('on', !!p.tela);

  camera(p.cam || MUNDO);
  focar(p.foco);
  if(p.anim) p.anim();
  if(p.incidente !== undefined) rodarIncidente(p.incidente);

  $('contador').textContent = `${i + 1} / ${PARADAS.length}`;
  [...$('pontos').children].forEach((b, k) => {
    b.classList.toggle('atual', k === i);
    b.classList.toggle('feito', k < i);
  });
  try{ history.replaceState(null, '', '#' + (i + 1)); }catch(e){}
}

$('ant').addEventListener('click', () => ir(atual - 1));
$('prox').addEventListener('click', () => ir(atual + 1));
document.addEventListener('keydown', e => {
  if(e.target.closest && e.target.closest('button') && (e.key === ' ' || e.key === 'Enter')) return;
  if(['ArrowRight', 'PageDown', ' '].includes(e.key)){ e.preventDefault(); ir(atual + 1); }
  else if(['ArrowLeft', 'PageUp'].includes(e.key)){ e.preventDefault(); ir(atual - 1); }
  else if(e.key === 'Home') ir(0);
  else if(e.key === 'End') ir(PARADAS.length - 1);
  else if(e.key === 'n' || e.key === 'N') document.body.classList.toggle('com-notas');
  else if(e.key === 'f' || e.key === 'F'){
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.();
  }
});

// o endereço #N abre direto na parada N (útil para ensaiar uma parte)
function paradaDoEndereco(){
  const n = parseInt(location.hash.slice(1), 10);
  return Number.isFinite(n) ? n - 1 : 0;
}
window.addEventListener('hashchange', () => { if(paradaDoEndereco() !== atual) ir(paradaDoEndereco()); });

montarPontos();
ir(paradaDoEndereco());
</script>
