<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyberappfin: a jornada do pacote</title>
<meta name="description" content="Apresentação interativa do ambiente de segurança da Cyberappfin (Defesa Cibernética, Impacta).">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B1520'/%3E%3Crect x='12' y='40' width='40' height='6' rx='3' fill='%2314B8A6'/%3E%3Crect x='12' y='29' width='40' height='6' rx='3' fill='%238B5CF6'/%3E%3Crect x='12' y='18' width='40' height='6' rx='3' fill='%23F59E0B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1520; --bg-2:#101E2C; --panel:#13212F; --line:#26384A; --line-2:#344B61;
    --text:#EEF3F8; --muted:#9FB1C3; --soft:#C7D4E1;
    --net:#14B8A6; --iam:#8B5CF6; --soc:#F59E0B; --end:#22C55E; --grc:#EAB308;
    --brand:#4C8DF6; --danger:#F87171;
    --panel-w:560px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; background:var(--bg); color:var(--text); font-family:'DM Sans', system-ui, sans-serif; overflow:hidden; }
  body{ -webkit-user-select:none; user-select:none; }
  /* cursor some depois de 2,5 s parado; volta ao mexer o mouse */
  body.sem-cursor, body.sem-cursor *{ cursor:none !important; }
  /* tela preta (tecla B ou ponto, como nos passadores de slide) */
  #preto{ position:fixed; inset:0; background:#000; z-index:50; opacity:0; pointer-events:none; transition:opacity .3s ease; }
  body.tela-preta #preto{ opacity:1; pointer-events:auto; }
  .mono{ font-family:'JetBrains Mono', ui-monospace, monospace; }

  /* ---------- palco ---------- */
  #stage{ position:fixed; inset:0 var(--panel-w) 64px 0; }
  #mapa{ width:100%; height:100%; display:block; }
  #mapa text{ font-family:'DM Sans', system-ui, sans-serif; fill:var(--text); }
  #mapa .t-title{ font-family:'Sora', system-ui, sans-serif; font-weight:700; }
  #mapa .t-mono{ font-family:'JetBrains Mono', ui-monospace, monospace; fill:var(--muted); }
  #mapa .t-muted{ fill:var(--muted); }
  .no{ transition:opacity .45s ease; }
  body.focando .no{ opacity:.18; }
  body.focando .no.foco{ opacity:1; }
  .lig{ fill:none; stroke:var(--line-2); stroke-width:2.5; }
  .lig.trac{ stroke-dasharray:7 7; }
  .barramento{ fill:none; stroke:#3E5A75; stroke-width:7; stroke-linecap:round; }
  .host rect{ transition:stroke .3s, fill .3s; }
  .host.alerta rect{ stroke:var(--danger) !important; fill:#3A1C21 !important; }
  .pulso{ animation:pulso 1.4s ease-in-out infinite; }
  @keyframes pulso{ 0%,100%{ opacity:1 } 50%{ opacity:.35 } }

  /* ---------- marca d'água da faculdade (canto superior direito) ---------- */
  #marca{ position:fixed; top:16px; right:22px; height:34px; width:auto; z-index:30; pointer-events:none;
          filter:brightness(0) invert(1); opacity:.42; }
  body.modo-sala #marca{ height:40px; top:22px; right:30px; }

  /* ---------- painel lateral ---------- */
  #painel{
    position:fixed; top:0; right:0; bottom:64px; width:var(--panel-w);
    background:var(--panel); border-left:1px solid var(--line);
    display:flex; flex-direction:column; overflow:hidden;
  }
  #painel .topo{ padding:28px 36px 0; display:flex; flex-direction:column; gap:10px; }
  #quem{ align-self:flex-start; font-size:13px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
         padding:6px 12px; border-radius:999px; background:#1C2F42; color:var(--soft); }
  #painel h1{ font-family:'Sora', system-ui, sans-serif; font-size:32px; line-height:1.15; font-weight:700; }
  #painel .sub{ color:var(--muted); font-size:16px; }
  #conteudo{ padding:20px 36px 32px; overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:16px; }
  #conteudo p{ font-size:17px; line-height:1.55; color:var(--soft); }
  #conteudo b{ color:var(--text); }
  #conteudo h3{ font-family:'Sora', system-ui, sans-serif; font-size:15px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-top:6px; }
  #conteudo ul{ list-style:none; display:flex; flex-direction:column; gap:8px; }
  #conteudo li{ font-size:16.5px; line-height:1.45; color:var(--soft); padding-left:18px; position:relative; }
  #conteudo li::before{ content:""; position:absolute; left:0; top:.6em; width:7px; height:7px; border-radius:50%; background:var(--cor, var(--brand)); }
  #conteudo table{ width:100%; border-collapse:collapse; font-size:15px; }
  #conteudo th{ text-align:left; color:var(--muted); font-weight:700; padding:7px 8px; border-bottom:1px solid var(--line-2); }
  #conteudo td{ padding:7px 8px; border-bottom:1px solid var(--line); color:var(--soft); vertical-align:top; }
  #conteudo tr.dest td{ color:var(--text); background:#2A2112; }
  #conteudo tr.perigo td{ color:var(--text); background:#2C1A1E; }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{ font-size:14px; padding:5px 11px; border-radius:999px; background:#1C2F42; color:var(--soft); }
  .cards{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .card{ background:var(--bg-2); border:1px solid var(--line); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:4px; }
  .card .n{ font-family:'Sora', system-ui, sans-serif; font-size:28px; font-weight:800; color:var(--cor, var(--brand)); line-height:1.1; }
  .card .l{ font-size:14px; color:var(--muted); }
  .barras{ display:flex; flex-direction:column; gap:7px; }
  .barra{ display:grid; grid-template-columns:100px 1fr 44px; align-items:center; gap:10px; font-size:15px; color:var(--soft); }
  .barra i{ display:block; height:14px; border-radius:4px; }
  .aviso{ font-size:14px; color:#F5B95A; border-left:3px solid #F5B95A; padding:6px 10px; background:#241C10; border-radius:0 8px 8px 0; }
  .passos{ display:flex; flex-direction:column; gap:8px; counter-reset:p; }
  .passo{ display:flex; gap:12px; align-items:flex-start; font-size:16px; color:var(--muted); transition:color .3s; }
  .passo::before{ counter-increment:p; content:counter(p); flex-shrink:0; width:26px; height:26px; border-radius:50%;
                  display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; background:#1C2F42; color:var(--muted); }
  .passo.ativo{ color:var(--text); }
  .passo.ativo::before{ background:var(--danger); color:#1A0E10; }
  /* notas de fala: flutuam acima do rodapé, nos dois modos */
  #notas{ display:none; position:fixed; left:24px; bottom:80px; width:min(760px, 60vw); z-index:20; padding:16px 18px;
          background:rgba(9,18,27,.96); border:1px dashed #4B6580; border-radius:12px;
          font-size:16px; line-height:1.5; color:var(--soft); max-height:32vh; overflow-y:auto; box-shadow:0 12px 30px rgba(0,0,0,.4); }
  body.com-notas #notas{ display:block; }

  /* ---------- foto (ou vídeo) do prédio na abertura ---------- */
  #capa-midia{ position:fixed; left:0; top:0; width:100%; height:calc(100% - 64px); overflow:hidden; background:#0B1A2E; opacity:0; pointer-events:none; transition:opacity .8s ease; }
  #capa-midia img, #capa-midia video{ width:100%; height:100%; object-fit:cover; object-position:70% 50%; transform-origin:72% 55%; }
  #capa-midia img{ animation:aproxima 24s ease-in-out infinite alternate; }
  #capa-midia::after{ content:""; position:absolute; inset:0;
    background:linear-gradient(90deg, rgba(11,21,32,.96) 0%, rgba(11,21,32,.82) 34%, rgba(11,21,32,.25) 60%, rgba(11,21,32,0) 78%),
               linear-gradient(0deg, rgba(11,21,32,.7) 0%, rgba(11,21,32,0) 30%); }
  @keyframes aproxima{ from{ transform:translateX(7%) scale(1) } to{ transform:translateX(7%) scale(1.09) } }
  body.com-foto #capa-midia{ opacity:1; }
  body.com-foto #stage{ opacity:0 !important; }
  body.com-foto #sala{ background:transparent; }
  body.com-foto .s-corpo{ max-width:47vw; }
  /* foto ao fundo de outras telas de sala (mais escura, sem estreitar o texto) */
  body.foto-fundo #capa-midia{ opacity:1; }
  body.foto-fundo #capa-midia::after{ background:rgba(11,21,32,.86); }
  body.foto-fundo #stage{ opacity:0 !important; }
  body.foto-fundo #sala{ background:transparent; }
  /* "entrar no prédio": zoom contínuo até a porta de entrada e dissolve no mapa */
  body.entrando #capa-midia{ opacity:1; }
  body.entrando #capa-midia::after{ background:rgba(11,21,32,.1); transition:background .5s ease; }
  body.entrando #capa-midia img{ transform-origin:57% 77%; animation:entrar 1.7s cubic-bezier(.55,0,.35,1) forwards; }
  body.entrando #sala, body.entrando #painel, body.entrando #stage{ opacity:0 !important; }
  /* fora das telas com foto, ela some na hora (sem reaparecer depois do zoom) */
  body:not(.com-foto):not(.foto-fundo):not(.entrando) #capa-midia{ transition:none; }
  @keyframes entrar{
    0%  { transform:translateX(7%) scale(1.02); filter:blur(0) brightness(1); opacity:1; }
    70% { filter:blur(2px) brightness(1.25); opacity:1; }
    100%{ transform:translateX(7%) scale(7); filter:blur(8px) brightness(1.6); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){ #capa-midia img{ animation:none !important; } }

  /* ---------- modo "sala de reunião": telas cheias de processo e gestão ---------- */
  #stage, #painel{ transition:opacity .5s ease, transform .6s cubic-bezier(.22,.61,.36,1), filter .5s ease; }
  body.modo-sala #stage{ opacity:.12; transform:scale(.94); filter:blur(3px); }
  body.modo-sala #painel{ opacity:0; transform:translateX(40px); pointer-events:none; }
  #sala{
    position:fixed; inset:0 0 64px 0; display:flex; flex-direction:column; gap:3.2vh;
    padding:6vh 6vw 5vh; overflow-y:auto;
    background:radial-gradient(ellipse at 20% 15%, rgba(26,48,74,.92) 0%, rgba(11,21,32,.97) 60%);
    opacity:0; pointer-events:none; transform:translateY(16px);
    transition:opacity .5s ease .1s, transform .6s cubic-bezier(.22,.61,.36,1) .1s;
  }
  body.modo-sala #sala{ opacity:1; pointer-events:auto; transform:none; }
  .s-head{ display:flex; flex-direction:column; gap:1.2vh; }
  .s-quem{ align-self:flex-start; font-size:clamp(12px, .9vw, 15px); font-weight:700; letter-spacing:.12em; text-transform:uppercase;
           padding:6px 14px; border-radius:999px; background:#1C2F42; }
  .s-titulo{ font-family:'Sora', system-ui, sans-serif; font-size:clamp(34px, 3.6vw, 64px); font-weight:800; line-height:1.05; letter-spacing:-.01em; }
  .s-sub{ font-size:clamp(16px, 1.2vw, 22px); color:var(--muted); }
  .s-corpo{ flex:1; display:flex; flex-direction:column; gap:2.6vh; min-height:0; }
  .s-txt{ font-size:clamp(16px, 1.15vw, 21px); line-height:1.5; color:var(--soft); }
  .s-txt b{ color:var(--text); }
  .s-rot{ font-family:'Sora', system-ui, sans-serif; font-size:clamp(12px, .85vw, 15px); font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
  .linha{ display:grid; gap:1.4vw; }
  .bloco{ background:#132233; border:1px solid var(--line); border-radius:16px; padding:clamp(16px, 1.6vw, 28px);
          display:flex; flex-direction:column; gap:10px; position:relative; overflow:hidden; }
  .bloco::before{ content:""; position:absolute; left:0; top:0; right:0; height:5px; background:var(--cor, var(--brand)); }
  .bloco h4{ font-family:'Sora', system-ui, sans-serif; font-size:clamp(18px, 1.45vw, 26px); font-weight:700; line-height:1.2; }
  .bloco p{ font-size:clamp(14px, 1vw, 18px); line-height:1.45; color:var(--soft); }
  .bloco .grande{ font-family:'Sora', system-ui, sans-serif; font-size:clamp(34px, 3.4vw, 60px); font-weight:800; line-height:1; color:var(--cor, var(--brand)); }
  .bloco .rot{ font-size:clamp(12px, .85vw, 15px); font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  .bloco .rodape{ margin-top:auto; padding-top:10px; border-top:1px solid var(--line); font-size:clamp(14px, 1vw, 18px); color:var(--text); }
  .chips2{ display:flex; flex-wrap:wrap; gap:10px; }
  .chips2 span{ font-size:clamp(14px, 1vw, 18px); padding:7px 14px; border-radius:999px; background:#1C2F42; color:var(--soft); }
  /* linha do tempo */
  .tempo{ display:grid; grid-template-columns:repeat(var(--n), 1fr); gap:0; position:relative; }
  .tempo::before{ content:""; position:absolute; left:4%; right:4%; top:22px; height:3px; background:linear-gradient(90deg, var(--brand), var(--soc)); opacity:.6; }
  .etapa{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px; padding:0 8px; position:relative; }
  .etapa .bola{ width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center;
                font-family:'Sora', system-ui, sans-serif; font-weight:800; font-size:18px; background:#0B1520; border:3px solid var(--cor, var(--brand)); color:var(--text); }
  .etapa h4{ font-family:'Sora', system-ui, sans-serif; font-size:clamp(15px, 1.15vw, 21px); font-weight:700; line-height:1.2; }
  .etapa p{ font-size:clamp(13px, .95vw, 17px); line-height:1.4; color:var(--muted); }
  /* organograma do CSIRT */
  .org{ display:flex; flex-direction:column; align-items:center; gap:0; }
  .org .chefe{ background:#2A2112; border:2px solid var(--soc); border-radius:14px; padding:14px 26px; text-align:center; }
  .org .chefe h4{ font-family:'Sora', system-ui, sans-serif; font-size:clamp(17px, 1.3vw, 23px); }
  .org .chefe p{ font-size:clamp(13px, .95vw, 16px); color:var(--soft); }
  .org .tronco{ width:3px; height:22px; background:var(--line-2); }
  .org .ramos{ display:grid; grid-template-columns:repeat(6, 1fr); gap:12px; width:100%; position:relative; padding-top:22px; }
  .org .ramos::before{ content:""; position:absolute; top:0; left:8.3%; right:8.3%; height:3px; background:var(--line-2); }
  .org .membro{ background:#132233; border:1px solid var(--line); border-top:4px solid var(--cor); border-radius:12px; padding:14px; position:relative; }
  .org .membro::before{ content:""; position:absolute; top:-26px; left:50%; width:3px; height:22px; background:var(--line-2); }
  .org .membro h4{ font-family:'Sora', system-ui, sans-serif; font-size:clamp(14px, 1.05vw, 19px); margin-bottom:6px; }
  .org .membro p{ font-size:clamp(12px, .9vw, 16px); line-height:1.4; color:var(--soft); }
  /* barras de tempo (RTO) */
  .rto{ display:flex; flex-direction:column; gap:14px; }
  .rto .item{ display:grid; grid-template-columns:minmax(160px, 22%) 1fr; gap:16px; align-items:center; }
  .rto .nome{ font-size:clamp(15px, 1.1vw, 20px); font-weight:700; }
  .rto .trilho{ position:relative; height:38px; background:#132233; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .rto .trilho i{ position:absolute; left:0; top:0; bottom:0; border-radius:10px 0 0 10px; }
  .rto .trilho span{ position:absolute; top:50%; transform:translateY(-50%); font-size:clamp(13px, .95vw, 17px); white-space:nowrap; color:var(--text); }
  /* documentos */
  .doc{ background:#F3F1EA; color:#1D2733; border-radius:6px 26px 6px 6px; padding:clamp(18px, 1.6vw, 28px); display:flex; flex-direction:column; gap:10px;
        box-shadow:0 18px 40px rgba(0,0,0,.35); position:relative; }
  .doc::after{ content:""; position:absolute; top:0; right:0; width:26px; height:26px; background:linear-gradient(225deg, #0B1520 50%, #CFCAB9 50%); border-radius:0 0 0 6px; }
  .doc .cod{ font-family:'JetBrains Mono', monospace; font-size:clamp(12px, .85vw, 15px); color:#5B6573; }
  .doc h4{ font-family:'Sora', system-ui, sans-serif; font-size:clamp(17px, 1.3vw, 23px); line-height:1.2; }
  .doc p{ font-size:clamp(13px, .95vw, 17px); line-height:1.45; color:#3B4654; }
  .doc .selo2{ align-self:flex-start; margin-top:auto; font-size:clamp(12px, .85vw, 15px); font-weight:700; padding:5px 12px; border-radius:999px; }
  /* camadas da aplicação */
  .pilha{ display:grid; grid-template-columns:1fr auto 1fr auto 1fr; gap:14px; align-items:stretch; }
  .seta{ align-self:center; font-size:34px; color:var(--line-2); }
  .s-aviso{ font-size:clamp(13px, .95vw, 17px); color:#F5B95A; border-left:3px solid #F5B95A; padding:8px 12px; background:#241C10; border-radius:0 8px 8px 0; align-self:flex-start; }
  .lema2{ display:flex; gap:20px; flex-wrap:wrap; font-family:'Sora', system-ui, sans-serif; font-size:clamp(20px, 2vw, 34px); font-weight:700; color:var(--soft); }
  .lema2 span:nth-child(even){ color:#4B6580; }
  .faixa{ height:6px; width:min(520px, 60%); border-radius:3px; background:linear-gradient(90deg, var(--brand), var(--iam), var(--net), var(--soc), var(--end)); }
  /* BIA: relógios por serviço */
  .relogio{ display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; padding:6px 0; }
  .relogio div{ display:flex; flex-direction:column; gap:2px; }
  .relogio b{ white-space:nowrap; font-family:'Sora', system-ui, sans-serif; font-size:clamp(17px, 1.6vw, 30px); font-weight:800; line-height:1.05; color:var(--cor); }
  .relogio span{ font-size:clamp(11px, .8vw, 14px); font-weight:700; letter-spacing:.1em; color:var(--muted); }
  /* BIA: mapa de calor no tempo */
  .calor{ display:grid; grid-template-columns:minmax(150px, 15%) repeat(5, 1fr); gap:6px; }
  .calor .cab{ font-family:'Sora', system-ui, sans-serif; font-size:clamp(13px, 1vw, 18px); font-weight:700; color:var(--muted); text-align:center; padding:6px 0; }
  .calor .srv{ font-size:clamp(14px, 1.05vw, 19px); font-weight:700; display:flex; align-items:center; }
  .calor .cel{ border-radius:8px; padding:clamp(8px, .8vw, 14px) 6px; text-align:center; font-size:clamp(13px, .95vw, 17px); font-weight:700; color:#160C0E; }
  .calor .n2{ background:#FACC15; } .calor .n3{ background:#FB923C; } .calor .n4{ background:#F87171; }
  .marcos{ display:grid; grid-template-columns:minmax(150px, 15%) repeat(5, 1fr); gap:6px; margin-top:4px; }
  .marcos p{ font-size:clamp(12px, .88vw, 16px); line-height:1.4; color:var(--soft); border-top:2px solid var(--line-2); padding-top:8px; }
  /* BIA: ordem de recuperação */
  .ordem .bloco{ flex-direction:row; align-items:flex-start; gap:14px; }
  .ordem .num{ font-family:'Sora', system-ui, sans-serif; font-size:clamp(26px, 2.4vw, 44px); font-weight:800; line-height:1; color:var(--cor); min-width:1.2em; }
  /* escalonamento em escada */
  .escada{ display:grid; grid-template-columns:repeat(5, 1fr); gap:1vw; align-items:end; }
  .escada .bloco{ gap:8px; }
  .escada .bloco:nth-child(2){ margin-bottom:2.2vh; } .escada .bloco:nth-child(3){ margin-bottom:4.4vh; }
  .escada .bloco:nth-child(4){ margin-bottom:6.6vh; } .escada .bloco:nth-child(5){ margin-bottom:8.8vh; }
  .escada .rodape{ font-size:clamp(13px, .92vw, 16px); color:var(--soft); }
  .escada .rodape b{ color:var(--cor); }
  .gigante{ font-family:'Sora', system-ui, sans-serif; font-size:clamp(56px, 7.5vw, 140px); font-weight:800; line-height:.95; letter-spacing:-.03em; }

  /* ---------- rodapé de navegação ---------- */
  #rodape{
    position:fixed; left:0; right:0; bottom:0; height:64px; background:#09121B; border-top:1px solid var(--line);
    display:flex; align-items:center; gap:20px; padding:0 24px;
  }
  #rodape button{ background:#1A2B3C; color:var(--text); border:1px solid var(--line-2); border-radius:10px;
                  font:600 15px 'DM Sans', system-ui, sans-serif; padding:9px 16px; cursor:pointer; }
  #rodape button:hover{ background:#22384D; }
  #rodape button:focus-visible{ outline:2px solid var(--brand); outline-offset:2px; }
  #pontos{ flex:1; display:flex; gap:6px; align-items:center; overflow:hidden; }
  #pontos button{ flex:1; min-width:6px; height:8px; padding:0; border-radius:4px; border:none; background:#22384D; }
  #pontos button.feito{ background:#3D5F82; }
  #pontos button.atual{ background:var(--brand); height:12px; }
  #contador{ font-size:15px; color:var(--muted); min-width:64px; text-align:right; }
  #dica{ font-size:13px; color:#5F7790; }

  @media (max-height:820px){

let geracao = 0;          // muda a cada parada: cancela animações antigas

function limparAnimacoes(){

// caminho em "L" passando pelo barramento: host -> trunk -> host
function viaBus(a, b){
  if(a.x === b.x) return [a, b];
  return [a, { x:a.x, y:BUS_Y }, { x:b.x, y:BUS_Y }, b];
}
function pacote(pontos, cor, dur = 1600, raio = 7){
  const minha = geracao;
  return new Promise(resolve => {
    const d = 'M' + pontos.map(p => `${p.x} ${p.y}`).join(' L');
    const trilha = el('path', { d, fill:'none', stroke:cor, 'stroke-width':2, 'stroke-opacity':.35, 'stroke-dasharray':'4 6' }, camada);
    const c = el('circle', { r:raio, fill:cor, filter:'url(#brilho)' }, camada);
    const total = trilha.getTotalLength();
    const reduzir = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const t0 = performance.now();
    function quadro(t){
      if(minha !== geracao){ resolve(false); return; }
      const k = reduzir ? 1 : Math.min(1, (t - t0) / dur);
      const p = trilha.getPointAtLength(total * k);
      c.setAttribute('cx', p.x); c.setAttribute('cy', p.y);
      if(k < 1) requestAnimationFrame(quadro);
      else { setTimeout(() => { trilha.remove(); c.remove(); resolve(true); }, 250); }
    }
    requestAnimationFrame(quadro);
  });
}
// repete um conjunto de pacotes enquanto a parada estiver ativa
function emLoop(fn, intervalo){
  const minha = geracao;
  (async function volta(){
    while(minha === geracao){
      fn();
      await new Promise(r => setTimeout(r, intervalo));
    }
  })();
}

/* ---------- câmera (viewBox animado) ---------- */
let vbAtual = [...MUNDO];
let animCam = null;
function camera(alvo, dur = 900){
  const ini = [...vbAtual];
  const t0 = performance.now();
  cancelAnimationFrame(animCam);
  const ease = k => k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
  const reduzir = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function quadro(t){
    const k = reduzir ? 1 : Math.min(1, (t - t0) / dur);
    vbAtual = ini.map((v, i) => v + (alvo[i] - v) * ease(k));
    svg.setAttribute('viewBox', vbAtual.join(' '));
    if(k < 1) animCam = requestAnimationFrame(quadro);
  }
  animCam = requestAnimationFrame(quadro);
}

}

/* ---------- navegação ---------- */
const $ = id => document.getElementById(id);
let atual = 0;

function montarPontos(){
  $('pontos').innerHTML = '';
  PARADAS.forEach((p, i) => {
    const b = document.createElement('button');
    b.setAttribute('aria-label', `Ir para ${i + 1}: ${p.titulo}`);
    b.title = p.titulo;
    b.addEventListener('click', () => ir(i));
    $('pontos').appendChild(b);
  });
}

async function rodarIncidente(passo){
  const minha = geracao;
  const ws = hostCentro(3, 0), wz = hostCentro(4, 0), ia = hostCentro(4, 3), it = hostCentro(4, 4), ad = hostCentro(1, 0);
  resetIncidente();
  if(passo === 0){
    // e-mail de phishing: SD-WAN -> UniFi -> Cisco -> workstation da VLAN 40
    await pacote([{x:120,y:170},{x:300,y:170},{x:460,y:172},{x:700,y:170},{x:820,y:170},{x:820,y:BUS_Y},{x:ws.x,y:BUS_Y},ws], COR.danger, 3200, 9);
    if(minha === geracao){ WS.classList.add('alerta'); selo(WS, 'CLICOU', COR.danger); }
    return;
  }
  WS.classList.add('alerta');
  selo(WS, 'SUSPEITA', COR.danger);
  if(passo === 1){
    // detecção no Wazuh e classificação pela CyberFin IA
    emLoop(async () => { if(await pacote(viaBus(ws, wz), COR.danger, 1500, 7)) pacote([wz, ia], '#FCA5A5', 900, 6); }, 3000);
  }
  if(passo === 2){
    // analista confirma: ticket no ITSM
    emLoop(async () => { if(await pacote([ia, it], '#FCD34D', 900, 7) && minha === geracao) selo(ITSM, 'INC ABERTO', '#FCD34D'); }, 2400);
  }
  if(passo === 3){
    // contenção: Network bloqueia no UniFi, IAM reseta a credencial, Endpoint verifica a estação
    selo(ITSM, 'INC ABERTO', '#FCD34D');
    emLoop(() => {
      pacote([it, {x:it.x,y:BUS_Y}, {x:820,y:BUS_Y}, {x:820,y:170}, {x:620,y:170}, {x:460,y:172}], COR.net, 2000, 7);
      setTimeout(() => pacote(viaBus(it, ad), COR.iam, 1800, 7), 400);
      setTimeout(() => pacote(viaBus(it, ws), COR.end, 1600, 7), 800);
    }, 3400);
    setTimeout(() => { if(minha === geracao){ WS.classList.remove('alerta'); selo(WS, 'CONTIDA', COR.end); } }, 2600);
  }
}

function ir(i){
  i = Math.max(0, Math.min(PARADAS.length - 1, i));
  const p = PARADAS[i];
  const anterior = PARADAS[atual];
  const avancando = i > atual;
  atual = i;
  limparAnimacoes();

  // o estado da simulação só existe nas paradas do incidente
  resetIncidente();

  $('quem').textContent = p.quem;
  $('quem').hidden = !p.quem;
  $('quem').style.color = p.cor;
  $('titulo').textContent = p.titulo;
  $('subtitulo').textContent = p.sub || '';
  $('conteudo').innerHTML = p.html || '';
  $('conteudo').scrollTop = 0;
  $('notas').textContent = p.notas || '';

  // foto do prédio: capa (foto:true), fundo escuro (foto:'fundo') e,
  // ao sair dela para o mapa, o zoom de "entrar no prédio"
  const corpo = document.body;
  corpo.classList.remove('entrando');
  if(anterior && anterior.foto && !p.foto && !p.sala && avancando){
    corpo.classList.remove('com-foto', 'foto-fundo');
    void corpo.offsetWidth; // reinicia a animação
    corpo.classList.add('entrando');
    const minhaEntrada = geracao;
    setTimeout(() => { if(minhaEntrada === geracao) corpo.classList.remove('entrando'); }, 1650);
  } else {
    corpo.classList.toggle('com-foto', p.foto === true);
    corpo.classList.toggle('foto-fundo', p.foto === 'fundo');
  }

  // modo sala (processo e gestão) ou modo mapa (técnico)
  const sala = !!p.sala;
  document.body.classList.toggle('modo-sala', sala);
  if(sala){
    $('sala').innerHTML = `<div class="s-head">
        ${p.quem ? `<span class="s-quem" style="color:${p.cor}">${p.quem}</span>` : ''}
        ${p.titulo !== 'Cyberappfin' && p.titulo !== 'Encerramento' ? `<h2 class="s-titulo">${p.titulo}</h2>` : ''}
        ${p.sub ? `<p class="s-sub">${p.sub}</p>` : ''}
      </div>${p.sala}`;
    $('sala').scrollTop = 0;
  }

  camera(sala ? MUNDO : (p.cam || MUNDO));
  focar(sala ? null : p.foco);
  // os pacotes só saem depois que a câmera termina de se mover, para não "se perderem"
  const minha = geracao;
  setTimeout(() => {
    if(minha !== geracao) return;
    if(p.anim) p.anim();
    if(p.incidente !== undefined) rodarIncidente(p.incidente);
  }, sala ? 0 : (corpo.classList.contains('entrando') ? 1900 : 950));

  $('contador').textContent = `${i + 1} / ${PARADAS.length}`;
  [...$('pontos').children].forEach((b, k) => {
    b.classList.toggle('atual', k === i);
    b.classList.toggle('feito', k < i);
  });
  try{ history.replaceState(null, '', '#' + (i + 1)); }catch(e){}
}

$('ant').addEventListener('click', () => ir(atual - 1));
$('prox').addEventListener('click', () => ir(atual + 1));
document.addEventListener('keydown', e => {
  if(e.target.closest && e.target.closest('button') && (e.key === ' ' || e.key === 'Enter')) return;
  if(['ArrowRight', 'PageDown', ' '].includes(e.key)){ e.preventDefault(); ir(atual + 1); }
  else if(['ArrowLeft', 'PageUp'].includes(e.key)){ e.preventDefault(); ir(atual - 1); }
  else if(e.key === 'Home') ir(0);
  else if(e.key === 'End') ir(PARADAS.length - 1);
  else if(e.key === 'n' || e.key === 'N') document.body.classList.toggle('com-notas');
  else if(e.key === 'b' || e.key === 'B' || e.key === '.') document.body.classList.toggle('tela-preta');
  else if(e.key === 'f' || e.key === 'F'){
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.();
  }
});

// cursor escondido quando o mouse fica parado (não aparece no projetor)
let timerCursor = null;
document.addEventListener('mousemove', () => {
  document.body.classList.remove('sem-cursor');
  clearTimeout(timerCursor);
  timerCursor = setTimeout(() => document.body.classList.add('sem-cursor'), 2500);
});

// o endereço #N abre direto na parada N (útil para ensaiar uma parte)
function paradaDoEndereco(){
  const n = parseInt(location.hash.slice(1), 10);
  return Number.isFinite(n) ? n - 1 : 0;
}
window.addEventListener('hashchange', () => { if(paradaDoEndereco() !== atual) ir(paradaDoEndereco()); });

montarPontos();
ir(paradaDoEndereco());
</script>
